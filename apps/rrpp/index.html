const { useState, useMemo, useRef } = React;

// ════════════════════════ 규격 정보 (매입가 제외) ════════════════════════
// 매입가(new/used)는 이 파일에 두지 않는다. 기기 저장(localStorage)에서 불러온다.

const DELIVERY_QTY = {

  R12:  { '1톤': 32,  '2.5톤': 128, '5톤': 192, '8톤': 224,  '11톤': 256, '15톤': null },

  R13L: { '1톤': 40,  '2.5톤': 120, '5톤': 200, '8톤': null, '11톤': 240, '15톤': 280 },
  RP11: { '1톤': 40,  '2.5톤': 160, '5톤': 240, '8톤': 280,  '11톤': 280, '15톤': 360 },
};

const VEHICLE_ORDER = ['1톤','2.5톤','5톤','8톤','11톤','15톤'];

const TRANSPORT_FEE = {
  '상차도': { min: 1500, max: 4000 },
  '도착도': { min: 1000, max: 2500 },
};

const PALLET_KEYS = Object.keys(PALLET_SPECS);

// ── 매입가(대외비): 앱에 암호문으로 내장 ──
// 평문은 저장소에 올라가지 않는다. 비밀번호를 한 번 입력하면 복호화해서 그 기기에만 저장한다.
// 암호문 생성: 매입가_암호화도구.html (로컬 전용, 저장소에 올리지 말 것)
const ENC_COST = 'zBVhzyCuJKbCXmn2PyClOxR3i8/lv9ZPuJ4AZmjRInoqY9obCUKY7OZirWFcXbxxF++GcRP1Jb4Sm9kg0IZk72nqWd8NVIuIkupZmi2GvFQRdI3/tj4weTjfT0XT0ejRcD4u/PzwqdM5BHvqEDD8XCd5iqSptcewbSN4hd02qzsCe/u0vson1K2rB5Ef59XTEfwzzxCiwcJNjafLyhI0RTNbiJsYiosvGAHHBqWqzTf7b/c7I+whaYeUYQTIRQd9f6+kdH0sTnKilj5DGzaojolVsKGu8iE8DBAJh9FSqWgQMsc5K7xLcnAEu01apRXKwndyCcFRnjtaLYEpIFnnVGxb5UvwX9i9PGAfyxv3Rew0n/zu6lfgsl18RnpyxGIxrXagMZHtgKqngrGWZhQpU5jDqrpzSP5EHYjliYKny2PS+frBMmP9weEpV7eLO2KlcqRGqPxNAL6O5yQXLJlWt8DIjboa/6ZeR5+9Zb4oiwvDZA==';
const ENC_ITER = 150000;
async function decryptCost(password) {
  const raw = Uint8Array.from(atob(ENC_COST), c => c.charCodeAt(0));
  const salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
  const baseKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: ENC_ITER, hash: 'SHA-256' }, baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct); // 비번 틀리면 throw
  return JSON.parse(new TextDecoder().decode(buf));
}
const hasEncCost = () => /^[A-Za-z0-9+/=]+$/.test(ENC_COST) && ENC_COST.length > 40;

const COST_KEY = 'bm_s3_cost';
const SHOWCOST_KEY = 'bm_s3_showcost';
function loadCost() {
  try { const o = JSON.parse(localStorage.getItem(COST_KEY) || '{}'); return (o && typeof o === 'object' && !Array.isArray(o)) ? o : {}; }
  catch (e) { return {}; }
}

function fmt(n) { return Math.round(n).toLocaleString(); }
function pr(n) { return (n === null || n === undefined) ? '—' : fmt(n); }
function fmtW(n) { return n % 1 === 0 ? n.toFixed(0) : n.toFixed(1); }

// ── 3D 시뮬레이션 계산 ──
function parseSize(s) {
  const m = String(s || '').split('*').map(x => parseFloat(x));
  return { L: m[0] || 1100, W: m[1] || 1100, H: m[2] || 150 };
}
// 유니트 1단에 박스 몇 개 — 0°/90° 두 방향 중 많은 쪽
function packLayer(pL, pW, bL, bW) {
  if (!bL || !bW) return null;
  const a = Math.floor(pL / bL) * Math.floor(pW / bW);
  const b = Math.floor(pL / bW) * Math.floor(pW / bL);
  return a >= b
    ? { n: a, cols: Math.floor(pL / bL), rows: Math.floor(pW / bW), rot: false }
    : { n: b, cols: Math.floor(pL / bW), rows: Math.floor(pW / bL), rot: true };
}

function recommendVehicle(palletType, qty) {
  if (!qty || !DELIVERY_QTY[palletType]) return null;
  for (const veh of VEHICLE_ORDER) {
    const cap = DELIVERY_QTY[palletType][veh];
    if (cap !== null && cap >= qty) return veh;
  }
  return null;
}

const INIT = {
  company: '',
  palletType: 'R11',
  marginRate: 7,
  conditionView: '모두',
  condition: '중고',
  qty: '',
  transportQtyType: '상차도',
  transportFeeType: '없음',
  transportFee: '',
  deliveryQtyType: '100매이하',
  deliveryQtyCustom: '',
  sellPrice: '',
  monthUsage: '',
  currentPrice: '',
  memo: '',
  location: '구미',
  product: '',
  exportCountry: '',
  recoveryRate: '',
  existingUse: '',
  competitor: '',
  // 3D 시뮬레이션 입력
  boxL: '', boxW: '', boxH: '',
  maxH: '1500',
  storeQty: '', storeStack: '2', aisle: '1.6',
};

// ════════════════════════ 3D 뷰 (Three.js) ════════════════════════
const MM = 0.001; // mm → m
function Sim3D({ mode, P, pack, layers, box, store, simRef, full }) {
  const mountRef = React.useRef(null);
  const ctxRef = React.useRef({});

  // 1) 초기화 (한 번)
  React.useEffect(() => {
    const THREE = window.THREE;
    const mount = mountRef.current;
    if (!THREE || !mount) return;
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setClearColor(0xeef2f7, 1);
    mount.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(42, 1, 0.05, 200);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 1.05));
    const dir = new THREE.DirectionalLight(0xffffff, 0.55);
    dir.position.set(3, 6, 4); scene.add(dir);
    const root = new THREE.Group(); scene.add(root);
    const grid = new THREE.GridHelper(20, 40, 0xc3ccd8, 0xdde3ea);
    grid.position.y = -0.002; scene.add(grid);

    const orbit = { theta: Math.PI * 0.22, phi: Math.PI * 0.34, r: 4, target: new THREE.Vector3(0, 0.4, 0) };
    const applyCam = () => {
      const { theta, phi, r, target } = orbit;
      camera.position.set(
        target.x + r * Math.sin(phi) * Math.sin(theta),
        target.y + r * Math.cos(phi),
        target.z + r * Math.sin(phi) * Math.cos(theta));
      camera.lookAt(target);
    };
    const c = ctxRef.current;
    Object.assign(c, { THREE, renderer, scene, camera, root, orbit, applyCam, grid });

    // 터치·마우스 오빗
    const pts = new Map(); let last = null, lastDist = 0;
    const el = renderer.domElement;
    el.style.touchAction = 'none'; el.style.display = 'block'; el.style.borderRadius = '10px';
    const down = e => { el.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); last = { x: e.clientX, y: e.clientY }; };
    const move = e => {
      if (!pts.has(e.pointerId)) return;
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pts.size >= 2) {
        const [a, b] = [...pts.values()];
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        if (lastDist) { orbit.r = Math.max(0.6, Math.min(40, orbit.r * (lastDist / d))); applyCam(); }
        lastDist = d;
      } else if (last) {
        orbit.theta -= (e.clientX - last.x) * 0.008;
        orbit.phi = Math.max(0.12, Math.min(Math.PI / 2.03, orbit.phi - (e.clientY - last.y) * 0.006));
        last = { x: e.clientX, y: e.clientY }; applyCam();
      }
    };
    const up = e => { pts.delete(e.pointerId); if (pts.size < 2) lastDist = 0; if (!pts.size) last = null; };
    const wheel = e => { e.preventDefault(); orbit.r = Math.max(0.6, Math.min(40, orbit.r * (1 + Math.sign(e.deltaY) * 0.12))); applyCam(); };
    el.addEventListener('pointerdown', down); el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    el.addEventListener('wheel', wheel, { passive: false });

    const resize = () => {
      const w = mount.clientWidth || 320, h = mount.clientHeight || 240;
      renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
    };
    resize(); applyCam();
    const ro = new ResizeObserver(resize); ro.observe(mount);
    renderer.setAnimationLoop(() => renderer.render(scene, camera));

    // 제안서 PDF용 스냅샷 등록
    if (simRef) simRef.current.snap = () => { try { renderer.render(scene, camera); return renderer.domElement.toDataURL('image/jpeg', 0.82); } catch (e) { return null; } };

    return () => {
      renderer.setAnimationLoop(null); ro.disconnect();
      el.removeEventListener('pointerdown', down); el.removeEventListener('pointermove', move);
      el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up);
      el.removeEventListener('wheel', wheel);
      renderer.dispose(); if (el.parentNode) el.parentNode.removeChild(el);
      if (simRef) simRef.current.snap = null;
    };
  }, []);

  // 2) 내용 갱신
  React.useEffect(() => {
    const c = ctxRef.current; if (!c.THREE) return;
    const { THREE, root, orbit, applyCam } = c;
    while (root.children.length) { const o = root.children.pop(); o.traverse && o.traverse(x => { x.geometry && x.geometry.dispose(); }); }

    const matP = new THREE.MeshLambertMaterial({ color: 0x1e5aa8 });
    const matB = new THREE.MeshLambertMaterial({ color: 0xd7a35c });
    const matS = new THREE.MeshLambertMaterial({ color: 0x93a3b5 });
    const L = P.L * MM, W = P.W * MM, H = P.H * MM;

    const pallet = (full3d) => {
      const g = new THREE.Group();
      if (!full3d) { const s = new THREE.Mesh(new THREE.BoxGeometry(L, H, W), matP); s.position.y = H / 2; g.add(s); return g; }
      const deckH = H * 0.2, botH = H * 0.16, blockH = H - deckH - botH, bs = Math.min(L, W) * 0.17;
      const top = new THREE.Mesh(new THREE.BoxGeometry(L, deckH, W), matP);
      top.position.y = H - deckH / 2; g.add(top);
      [-1, 0, 1].forEach(ix => [-1, 0, 1].forEach(iz => {
        const b = new THREE.Mesh(new THREE.BoxGeometry(bs, blockH, bs), matP);
        b.position.set(ix * (L / 2 - bs / 2), botH + blockH / 2, iz * (W / 2 - bs / 2)); g.add(b);
      }));
      [-1, 0, 1].forEach(iz => {
        const r = new THREE.Mesh(new THREE.BoxGeometry(L, botH, bs), matP);
        r.position.set(0, botH / 2, iz * (W / 2 - bs / 2)); g.add(r);
      });
      return g;
    };

    let span = Math.max(L, W) * 1.9, cy = H;

    if (mode === 'pallet') {
      root.add(pallet(true));
      cy = H * 1.5; span = Math.max(L, W) * 2.1;
    } else if (mode === 'cargo') {
      root.add(pallet(true));
      if (pack && pack.n > 0 && layers > 0) {
        const bl = (pack.rot ? box.W : box.L) * MM, bw = (pack.rot ? box.L : box.W) * MM, bh = box.H * MM;
        const ox = -(pack.cols * bl) / 2 + bl / 2, oz = -(pack.rows * bw) / 2 + bw / 2;
        const geo = new THREE.BoxGeometry(bl * 0.97, bh * 0.97, bw * 0.97);
        const cap = Math.min(layers, Math.ceil(600 / Math.max(1, pack.n)));
        for (let ly = 0; ly < cap; ly++)
          for (let ix = 0; ix < pack.cols; ix++)
            for (let iz = 0; iz < pack.rows; iz++) {
              const m = new THREE.Mesh(geo, matB);
              m.position.set(ox + ix * bl, H + bh / 2 + ly * bh, oz + iz * bw);
              root.add(m);
            }
        cy = (H + layers * bh) * 0.55; span = Math.max(L, W, layers * bh) * 2.0;
      }
    } else {
      const n = Math.min(store.bays, 150);
      const cols = Math.max(1, Math.ceil(Math.sqrt(n)));
      const gx = L * 1.12, gz = W * 1.12;
      const stackH = H * store.stack + 0.12 * store.stack;
      const unit = new THREE.BoxGeometry(L, stackH, W);
      for (let i = 0; i < n; i++) {
        const r = Math.floor(i / cols), cc = i % cols;
        const m = new THREE.Mesh(unit, i % 2 ? matS : matP);
        m.position.set((cc - (cols - 1) / 2) * gx, stackH / 2, (r - (Math.ceil(n / cols) - 1) / 2) * gz);
        root.add(m);
      }
      span = Math.max(cols * gx, Math.ceil(n / cols) * gz) * 1.5 || 3;
      cy = stackH;
    }
    orbit.target.set(0, cy * 0.5, 0);
    orbit.r = Math.max(0.9, span);
    applyCam();
  }, [mode, P.L, P.W, P.H, pack && pack.n, pack && pack.rot, layers, box.L, box.W, box.H, store.bays, store.stack]);

  return <div ref={mountRef} style={{ width: '100%', height: full ? 'calc(100vh - 190px)' : 240, background: '#eef2f7', borderRadius: 10, overflow: 'hidden' }} />;
}

function S3App() {
  const [f, setF] = useState(INIT);
  const [tab, setTab] = useState('quote');
  const [custOpen, setCustOpen] = useState(true);
  const [prodOpen, setProdOpen] = useState(true);
  const [saleOpen, setSaleOpen] = useState(true);
  const [showModal, setShowModal] = useState(false);
  const [copied, setCopied] = useState(false);
  const [showLogModal, setShowLogModal] = useState(false);
  const [showSaveMenu, setShowSaveMenu] = useState(false);
  const [logCopied, setLogCopied] = useState(false);
  // 매입가(기기 저장)
  const [cost, setCost] = useState(loadCost);
  const [showCost, setShowCost] = useState(() => localStorage.getItem(SHOWCOST_KEY) === '1');
  const [showData, setShowData] = useState(false);
  const [costText, setCostText] = useState('');
  const [costStat, setCostStat] = useState('');
  // 3D
  const [sim3d, setSim3d] = useState(false);
  const [simMode, setSimMode] = useState('pallet');
  const [simFull, setSimFull] = useState(false);
  const simRef = useRef({ snap: null });
  // 매입가 잠금해제(암호문 복호화)
  const [unlockPw, setUnlockPw] = useState('');
  const [unlockBusy, setUnlockBusy] = useState(false);
  const [unlockErr, setUnlockErr] = useState('');
  const textareaRef = useRef();
  const logTextareaRef = useRef();
  const costFileRef = useRef();

  const upd = (k, v) => setF(p => ({ ...p, [k]: v }));

  const hasCost = PALLET_KEYS.some(k => cost[k] && (typeof cost[k].new === 'number' || typeof cost[k].used === 'number'));

  const applyCost = (raw) => {
    let o;
    try { o = JSON.parse(raw); } catch (e) { setCostStat('❌ JSON 형식이 올바르지 않습니다.'); return; }
    if (!o || typeof o !== 'object' || Array.isArray(o)) { setCostStat('❌ 규격별 객체 형태의 JSON이어야 합니다.'); return; }
    const clean = {}; let n = 0;
    PALLET_KEYS.forEach(k => {
      const v = o[k];
      if (v && typeof v === 'object') {
        const e = {};
        if (typeof v.new === 'number') e.new = v.new;
        if (typeof v.used === 'number') e.used = v.used;
        if (e.new !== undefined || e.used !== undefined) { clean[k] = e; n++; }
      }
    });
    if (!n) { setCostStat('❌ 인식된 규격이 없습니다. 규격 코드(R11 등)를 확인하세요.'); return; }
    localStorage.setItem(COST_KEY, JSON.stringify(clean));

                    const rows = f.conditionView === '모두'

                      : [{ lbl: null, diff: cmpDiff, pct: cmpPct, ok: (f.conditionView === '신품' ? newPrice7 : usedPrice7) !== null }];
                    return rows.filter(r => r.ok).map(({ lbl, diff, pct }) => {
                      const up = diff < 0;
                      const clr = up ? '#16a34a' : '#dc2626';
                      const bg  = up ? 'rgba(22,163,74,0.12)' : 'rgba(220,38,38,0.10)';
                      return (

                            <span style={{ fontSize: 15, fontWeight: 800, color: clr }}>

                          </div>
                        </div>

                    });

                        <option value="중고유니트">중고유니트</option>

                    <div style={{ flex: 1 }}>

                    </div>
                  </div>

                        <option value="매당">매당</option>
                        <option value="차량당">차량당</option>
                        {f.deliveryQtyType !== '100매이하' && <option value="운반비별도">운반비 별도</option>}
                      </select>
                    </div>
                    {(f.transportFeeType === '매당' || f.transportFeeType === '차량당' || f.transportFeeType === '운반비별도') && (
                      <div style={{ flex: 1 }}>
                        <div style={{ fontSize: 10, fontWeight: 700, color: C.muted, marginBottom: 4 }}>
                          {f.transportFeeType === '매당' ? '원/매' : f.transportFeeType === '차량당' ? '원/차량' : '별도금액'}

                        <input

                          placeholder="금액 입력"
                          style={{ width: '100%', padding: '9px 6px', fontSize: 12 }} />
                      </div>
                    )}
                  </div>
                  {isDochakdo && f.deliveryQtyType === '100매이하'
                    && (f.transportFeeType === '매당' || f.transportFeeType === '차량당')

                currentPrice > 0 && savingPerUnit > 0 ? `절감효과: ${fmt(savingPerUnit)}원/매 (${savingPct.toFixed(1)}%)` : '',
                f.memo ? `※ ${f.memo}` : '',
                '유효 30일',
              ].filter(Boolean).join('\n')}
              onClick={e => { e.target.select(); e.target.setSelectionRange(0, 99999); }}
              style={{ width: '100%', height: 200, fontSize: 12, padding: 10, border: `1px solid #374151`, borderRadius: 8, fontFamily: 'monospace', background: '#1a1a2e', color: '#e2e8f0', resize: 'none', boxSizing: 'border-box', lineHeight: 1.8 }}
            />
            <button style={{ ...btnPri, marginTop: 10 }} onClick={() => doCopy(textareaRef.current?.value || '', textareaRef, setCopied)}>
              {copied ? '✅ 복사됨!' : '📋 클립보드 복사'}
            </button>
            <button style={{ ...btnGhost, marginTop: 8 }} onClick={() => setShowModal(false)}>닫기</button>
          </div>
        </div>
      )}

      {/* ── 저장 선택 메뉴 ── */}
      {showSaveMenu && (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', zIndex: 200, display: 'flex', alignItems: 'flex-end' }}
          onClick={() => setShowSaveMenu(false)}>
          <div style={{ background: '#fff', borderRadius: '20px 20px 0 0', padding: '20px 16px 40px', width: '100%', maxWidth: 480, margin: '0 auto' }}
            onClick={e => e.stopPropagation()}>
            <div style={{ textAlign: 'center', fontSize: 15, fontWeight: 800, color: '#123c7a', marginBottom: 16 }}>저장 방식 선택</div>
            <div style={{ display: 'flex', gap: 10 }}>
              <button style={{ flex: 1, padding: '18px 0', borderRadius: 12, border: '2px solid #123c7a', background: '#eff6ff', color: '#123c7a', fontWeight: 800, fontSize: 16, cursor: 'pointer', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6 }}
                onClick={() => { setShowSaveMenu(false); setShowModal(true); }}>
                <span style={{ fontSize: 28 }}>📤</span>
                공유
                <span style={{ fontSize: 11, fontWeight: 500, color: '#6b7280' }}>카톡·문자 공유</span>
              </button>
              <button style={{ flex: 1, padding: '18px 0', borderRadius: 12, border: '2px solid #16a34a', background: '#f0fdf4', color: '#16a34a', fontWeight: 800, fontSize: 16, cursor: 'pointer', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6 }}
                onClick={() => { setShowSaveMenu(false); setShowLogModal(true); }}>
                <span style={{ fontSize: 28 }}>📋</span>
                업무일지
                <span style={{ fontSize: 11, fontWeight: 500, color: '#6b7280' }}>업무일지 복사</span>
              </button>
            </div>
            <button style={{ marginTop: 12, width: '100%', padding: '12px', borderRadius: 10, border: '1px solid #e5e7eb', background: '#f3f4f6', color: '#6b7280', fontWeight: 600, fontSize: 14, cursor: 'pointer' }}
              onClick={() => setShowSaveMenu(false)}>닫기</button>
          </div>
        </div>
      )}

      {/* ── 업무일지 모달 ── */}
      {showLogModal && (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.55)', zIndex: 200, display: 'flex', alignItems: 'flex-end' }}
          onClick={() => setShowLogModal(false)}>
          <div style={{ background: '#222', borderRadius: '20px 20px 0 0', padding: '20px 16px 40px', width: '100%', maxWidth: 480, margin: '0 auto' }}
            onClick={e => e.stopPropagation()}>
            <div style={{ textAlign: 'center', fontSize: 14, fontWeight: 700, color: '#fff', marginBottom: 4 }}>📋 업무일지</div>
            <div style={{ fontSize: 11, color: '#9ca3af', textAlign: 'center', marginBottom: 12 }}>견적 폼 입력값으로 자동 생성됩니다. 박스를 눌러 전체 선택 또는 복사 버튼을 누르세요.</div>
            <textarea ref={logTextareaRef} readOnly value={logText}
              onClick={e => { e.target.select(); e.target.setSelectionRange(0, 99999); }}
              style={{ width: '100%', height: 180, fontSize: 12.5, padding: 12, border: `1px solid #374151`, borderRadius: 8, fontFamily: 'monospace', background: '#1a1a2e', color: '#e2e8f0', resize: 'none', boxSizing: 'border-box', lineHeight: 1.9 }}
            />
            <button style={{ ...btnPri, marginTop: 10 }} onClick={() => doCopy(logText, logTextareaRef, setLogCopied)}>
              {logCopied ? '✅ 복사됨!' : '📋 복사'}
            </button>
            <button style={{ ...btnGhost, marginTop: 8 }} onClick={() => setShowLogModal(false)}>닫기</button>
          </div>
        </div>
      )}
    </div>
  );
}

const container = document.getElementById('root');
const root = ReactDOM.createRoot(container);
root.render(React.createElement(S3App));
</script>
</body>
</html>
