<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Higgsfield 원본 예시</title><style>body{margin:0;overflow:hidden;background:#0c1b2a;color:#e3f3ff;font:15px system-ui}header{padding:18px 24px}h1{font-size:21px;margin:0 0 8px}p{margin:6px 0;color:#b8ccdb}canvas{display:block;width:100%;height:calc(100dvh - 135px);touch-action:none}a{color:#55dfbd}button{background:#234559;color:white;border:1px solid #668899;border-radius:6px;padding:6px 12px}</style><header><h1>Higgsfield 원본 자동창고 예시</h1><p>고정 예시: 500평 · 1,520셀 · 재고 1,000매 — 현재 입력 결과와 다릅니다.</p><p id="status">모델 로딩 중…</p><button id="reset">전체 보기</button> <a href="./index.html">입력 연동 앱으로</a></header><canvas></canvas><script type="module">
import * as T from './vendor/three.module.min.js';
import {GLTFLoader} from './vendor/GLTFLoader.js';
const canvas=document.querySelector('canvas'),renderer=new T.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.toneMapping=T.ACESFilmicToneMapping;
const scene=new T.Scene();scene.background=new T.Color(0x0c1b2a);scene.add(new T.HemisphereLight(0xe3f3ff,0x506579,2.1));const sun=new T.DirectionalLight(0xfff1de,3.2);sun.position.set(-20,40,-25);scene.add(sun);
const camera=new T.OrthographicCamera(),center=new T.Vector3();let radius=40,theta=-2.43,phi=1.06,span=30;
function render(){const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.left=-span*w/h;camera.right=span*w/h;camera.top=span;camera.bottom=-span;camera.near=.1;camera.far=2000;camera.updateProjectionMatrix();camera.position.copy(center).add(new T.Vector3().setFromSphericalCoords(radius,phi,theta));camera.lookAt(center);renderer.render(scene,camera);}
let box;function reset(){if(!box)return;box.getCenter(center);radius=box.getSize(new T.Vector3()).length()*2;span=box.getSize(new T.Vector3()).length()*.38;theta=-2.43;phi=1.06;render();}
try{const gltf=await new GLTFLoader().loadAsync('../assets/warehouse-higgsfield.glb');scene.add(gltf.scene);box=new T.Box3().setFromObject(gltf.scene);reset();document.querySelector('#status').textContent='원본 GLB · 드래그로 회전 / 휠로 확대';}catch(error){document.querySelector('#status').textContent='모델을 불러오지 못했습니다. 새로고침하여 다시 시도하세요.';console.error(error);}
let pointer;canvas.onpointerdown=e=>{pointer=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);};canvas.onpointermove=e=>{if(!pointer)return;theta-=(e.clientX-pointer[0])*.006;phi=T.MathUtils.clamp(phi+(e.clientY-pointer[1])*.006,.15,1.5);pointer=[e.clientX,e.clientY];render();};canvas.onpointerup=canvas.onpointercancel=()=>pointer=null;canvas.addEventListener('wheel',e=>{e.preventDefault();span=T.MathUtils.clamp(span*Math.exp(e.deltaY*.001),2,200);render();},{passive:false});document.querySelector('#reset').onclick=reset;new ResizeObserver(render).observe(canvas);
</script></html>
