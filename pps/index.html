<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>유니트 렌탈 견적</title>
<meta name="theme-color" content="#0a2d61">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="유니트견적">
<link rel="manifest" href='data:application/manifest+json,{"name":"유니트 렌탈 견적","short_name":"유니트견적","display":"standalone","background_color":"%23eef1f6","theme_color":"%230a2d61","start_url":"."}'>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="%230a2d61"/><rect x="12" y="36" width="40" height="8" rx="2" fill="%23f5c344"/><path d="M16 36v-7h8v7M28 36v-7h8v7M40 36v-7h8v7" stroke="%23f5c344" stroke-width="3" fill="none"/><path d="M20 52h24M26 46l-6 6 6 6M38 46l6 6-6 6" stroke="%23f5c344" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>'>
<style>
:root{
  --navy:#0b3a7c; --navy-d:#0a2d61; --navy-x:#082448; --navy-grad:linear-gradient(160deg,#0a2d61,#0b4da2);
  --gold:#f5c344; --gold-d:#d9a51f; --gold-bg:#f9f1da;
  --bg:#eef1f6; --card:#ffffff; --line:#d9dfeb; --line2:#e4e9f2;
  --txt:#141d33; --sub:#4d5e78; --mut:#8b99ad;
  --blue-l:#e8eef8; --ok:#1e7a46; --ok-bg:#e6f4ec; --warn:#b3341f; --warn-bg:#faeae6;
  --r:10px; --sh:0 2px 10px rgba(10,25,55,.07);
}
*{box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#dfe4ec; color:var(--txt);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  font-size:15px; line-height:1.55}
#shell{max-width:520px; margin:0 auto; min-height:100dvh; background:var(--bg);
  display:flex; flex-direction:column; position:relative; box-shadow:0 0 40px rgba(10,25,55,.12)}
#view{flex:1; display:flex; flex-direction:column; padding-bottom:86px}
button{font:inherit; cursor:pointer; border:none; background:none; color:inherit}
input,select,textarea{font:inherit; color:var(--txt); background:var(--card);
  border:1.5px solid var(--line); border-radius:8px; padding:9px 11px; width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--navy); outline-offset:1px}
input[type=number]{font-variant-numeric:tabular-nums}
input:disabled{background:var(--bg); color:var(--mut)}
textarea{resize:vertical; min-height:56px}

/* ---------- 헤더 · 스텝 ---------- */
.hdr{background:var(--navy-grad); color:#fff; padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 15px}
.hdr .brand{font-size:11px; font-weight:800; letter-spacing:.14em; color:var(--gold)}
.hdr h1{font-size:21px; font-weight:800; letter-spacing:-.01em; margin-top:4px}
.hdr .sub{font-size:12.5px; opacity:.78; margin-top:4px}
.steps{display:flex; background:var(--navy-d); padding:0 10px}
.step{flex:1; padding:9px 2px 11px; text-align:center; font-size:11px; font-weight:700;
  color:#7f95b8; border-bottom:3px solid transparent}
.step.on{color:var(--gold); border-bottom-color:var(--gold)}
.step.done{color:#cdd9ec}
.step .n{display:block; font-size:13px; font-weight:800}

/* ---------- 본문 공통 ---------- */
.body{padding:14px 16px 20px; display:flex; flex-direction:column; gap:12px}
.sec-t{font-size:13px; font-weight:800; color:var(--navy); letter-spacing:.02em;
  display:flex; align-items:center; gap:7px; margin-top:4px}
.sec-t::after{content:""; flex:1; height:1px; background:var(--line)}
.card{background:var(--card); border:1px solid var(--line2); border-bottom:2.5px solid var(--line2);
  border-radius:var(--r); box-shadow:var(--sh)}
.calc{padding:14px; display:flex; flex-direction:column; gap:11px}
.hint{font-size:11.5px; color:var(--mut)}
.rate-note{font-size:11.5px; color:var(--warn); background:var(--warn-bg);
  border:1px solid #f0d4cc; border-radius:8px; padding:8px 11px}
.frow{display:flex; gap:9px}
.fi{flex:1; display:flex; flex-direction:column; gap:5px; min-width:0}
.fi label{font-size:11.5px; font-weight:700; color:var(--sub)}
.unit{font-weight:500; color:var(--mut)}
.chkline{display:flex; gap:7px; align-items:center; font-size:12.5px; color:var(--sub); font-weight:700}
.chkline input{width:auto}

.seg{display:flex; background:var(--blue-l); border-radius:8px; padding:3px; gap:3px}
.seg button{flex:1; padding:8px 4px; border-radius:6px; font-size:13px; font-weight:700; color:var(--sub)}
.seg button.on{background:var(--navy); color:#fff}

.badge{display:inline-block; font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:99px; vertical-align:1px}
.b-est{background:var(--gold-bg); color:var(--gold-d)}
.b-ok{background:var(--ok-bg); color:var(--ok)}
.b-warn{background:var(--warn-bg); color:var(--warn)}

/* ---------- 결과 표시 ---------- */
.result{background:linear-gradient(160deg,#0a2d61,#083058); color:#fff; border-radius:8px; padding:13px 14px}
.result .rl{font-size:11.5px; font-weight:700; color:#9db4d8; letter-spacing:.04em}
.result .rv{font-size:23px; font-weight:800; color:var(--gold); font-variant-numeric:tabular-nums; margin-top:2px}
.rline{display:flex; justify-content:space-between; gap:10px; font-size:12.5px; padding:5px 0;
  border-bottom:1px solid rgba(255,255,255,.12); font-variant-numeric:tabular-nums}
.rline:last-child{border-bottom:none}
.rline b{color:var(--gold)}
.rlines{margin-top:9px}
.outbox{background:#0e1c33; color:#e8eef8; border-radius:8px; padding:13px 14px; font-size:13px;
  line-height:1.7; white-space:pre-wrap; word-break:break-all; border-left:3px solid var(--gold)}

/* ---------- 하단 내비 · 토스트 ---------- */
.navbar{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:520px;
  background:var(--card); border-top:1px solid var(--line);
  padding:11px 16px calc(env(safe-area-inset-bottom,0px) + 11px); display:flex; gap:9px; z-index:10}
.btn{border-radius:9px; padding:12px; font-size:14.5px; font-weight:800; text-align:center; flex:1}
.btn.prev{background:var(--blue-l); color:var(--navy)}
.btn.next{background:var(--navy); color:#fff}
.btn.gold{background:var(--gold); color:#4a3607}
#toast{position:fixed; bottom:90px; left:50%; transform:translateX(-50%) translateY(8px); background:#12213c; color:#fff;
  font-size:13px; font-weight:600; padding:9px 18px; border-radius:99px; opacity:0; transition:.25s; pointer-events:none; z-index:20}
#toast.on{opacity:1; transform:translateX(-50%) translateY(0)}

/* ---------- 도구 ---------- */
.acc{overflow:hidden}
.acc summary{list-style:none; cursor:pointer; padding:12px 14px; font-size:13.5px; font-weight:700;
  display:flex; justify-content:space-between; align-items:center; gap:8px}
.acc summary::-webkit-details-marker{display:none}
.acc .cbody{padding:0 14px 13px; font-size:13px; color:var(--sub); white-space:pre-wrap}
.chev{color:var(--mut); font-size:11px}
.scorewrap{display:flex; align-items:center; gap:12px}
.scorebar{flex:1; height:10px; background:var(--blue-l); border-radius:99px; overflow:hidden}
.scorebar i{display:block; height:100%; background:linear-gradient(90deg,#0b4da2,var(--gold)); border-radius:99px; transition:width .3s}
.scorev{font-size:21px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--navy)}
.fitrow{display:flex; align-items:center; gap:9px}
.fitrow .fn{flex:1.2; font-size:12.5px; font-weight:700; color:var(--sub)}
.fitrow .fw{font-size:10.5px; color:var(--mut); font-weight:700}
.fitrow select{flex:1}
.toollink{display:flex; align-items:center; gap:10px; padding:12px 14px; font-size:13.5px; font-weight:700;
  color:var(--txt); text-decoration:none}
.toollink small{display:block; font-size:11.5px; font-weight:500; color:var(--mut)}
.toollink .chev{margin-left:auto}
.tic{width:34px; height:34px; border-radius:8px; background:var(--blue-l); display:grid; place-items:center; font-size:16px; flex:none}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>
<div id="shell">
  <div class="hdr">
    <div class="brand">영업마스터 PRO</div>
    <h1>유니트 렌탈 견적</h1>
    <div class="sub" id="hsub">견적 전 확인 위저드</div>
  </div>
  <div class="steps" id="steps"></div>
  <div id="view"></div>
</div>
<div class="navbar" id="navbar"></div>
<div id="toast"></div>

<script>
/* ============================================================
   유틸 · 저장 (localStorage 접두어 pps1. — 영업마스터 bm3.과 분리)
   ============================================================ */
const $=s=>document.querySelector(s);
const won=n=>isFinite(n)?Math.round(n).toLocaleString('ko-KR'):'-';
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const store={
 get(k,d){try{const v=localStorage.getItem('pps1.'+k); return v==null?d:JSON.parse(v)}catch(e){return d}},
 set(k,v){try{localStorage.setItem('pps1.'+k,JSON.stringify(v))}catch(e){}}
};
let toastT=null;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),1800)}
function copyText(s){
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(()=>toast('복사되었습니다')).catch(()=>fallbackCopy(s))}
 else fallbackCopy(s);
}
function fallbackCopy(s){
 const ta=document.createElement('textarea'); ta.value=s; ta.style.position='fixed'; ta.style.opacity='0';
 document.body.appendChild(ta); ta.select();
 try{document.execCommand('copy'); toast('복사되었습니다')}catch(e){toast('복사 실패 — 길게 눌러 선택하세요')}
 document.body.removeChild(ta);
}

/* ============================================================
   상수
   ============================================================ */
const RATE_DEFAULT={keep:25, trans:2000, carry:600, lossFee:38500, days:30.4};
function rateGet(){return Object.assign({},RATE_DEFAULT,store.get('rate',{}))}
function rateSave(o){store.set('rate',o); toast('단가가 저장되었습니다')}

const QUOTE_KINDS=['신규','연장','경쟁사전환','재전환','점유율확대','이탈업체 재견적'];
const INDUSTRIES=['식품','음료','유화·화학','섬유','제지','비료·농산','유통','건자재','기타'];

const FIT_ITEMS=[
 {k:'volume',n:'출하 물량',w:15,q:'월평균·성수기 최대 출하량은 충분한가',o:['충분','보통','부족']},
 {k:'turn',n:'회전성',w:20,q:'평균 회전일과 연간 회전 수는',o:['빠름(30일 내)','보통','느림·장기체류']},
 {k:'dest',n:'착지 구조',w:25,q:'최종 납품처가 확인되고 회수가 가능한가',o:['확인·회수 가능','일부 확인','불분명']},
 {k:'var',n:'수요 변동성',w:10,q:'성수기·프로모션 물량 편차가 큰가',o:['편차 큼','보통','일정']},
 {k:'qual',n:'품질 요구',w:10,q:'위생·안전·자동화 대응 필요성',o:['높음','보통','낮음']},
 {k:'std',n:'표준화 효과',w:10,q:'규격 혼용으로 작업 손실이 있는가',o:['있음','일부','없음']},
 {k:'data',n:'데이터 제공',w:10,q:'출하처·수량·일자 정보 제공 가능한가',o:['가능','부분 가능','불가']}];

const OBJECTIONS=[
 {t:'"사서 쓰는 게 싸다"',b:'한자리에 두고 1년 내내 쓰는 고정 재고면 구매가 맞습니다 — 먼저 인정합니다.\n다만 사외로 나가는 물량은 구매가 외에 회수·분실·재구매·보관이 붙습니다. 내부 사용분과 외부 출하분을 분리해 1회전당 비용으로 비교하겠습니다.'},
 {t:'"회수는 우리 기사가 한다"',b:'그 인건비와 공차 운행비를 매당으로 나눠 보신 적 있으십니까? 지금 구조가 더 싸면 그 구간은 유지하고, 비효율적인 착지만 전환하는 게 맞습니다.\n→ "이 회수망을 직접 만드실 수 있습니까?"'},
 {t:'"성수기에만 더 필요하다"',b:'자가 보유는 피크 기준으로 사야 하고, 나머지 기간엔 자리만 차지합니다. 필요한 시기에, 필요한 장소에, 필요한 수량만 쓰고 반납하는 구조가 렌탈입니다.'},
 {t:'"창고에 쌓아두면 된다"',b:'빈 유니트가 차지하는 자리도 임차료입니다. 쓰다가 반납하면 사업장 공간을 차지하지도, 유지비가 들지도 않습니다.'},
 {t:'분실비 — 내 입으로 먼저 꺼낸다',b:'분실책임비가 매당 발생합니다(기본값 38,500원 VAT 포함 — 최신 단가표 확인). 숨기면 계약 후 반드시 클레임이 됩니다.\n뒤집기: 자가로 1,000매 굴리면 그 금액어치 자산이 현장에 흩어져 있는 겁니다. 렌탈은 분실분만 정산하고 대체 유니트가 바로 나가 조업이 멈추지 않습니다.'},
 {t:'"우리 유니트도 멀쩡하다"',b:'자가는 파손·오염을 걸러낼 설비를 갖추기 어렵습니다. 풀링은 거점에서 자동선별·고압 온수 세척 후 재공급합니다. 식품·제약·콜드체인 고객이면 결정타입니다.'},
 {t:'"규격은 우리 것도 표준이다"',b:'논점은 "표준이냐"가 아니라 "섞여 있느냐"입니다. 규격이 섞이면 차량 적재도 자동화설비도 어긋납니다.'},
 {t:'"타 풀사가 더 싸다"',b:'표면 단가는 그럴 수 있습니다. 납품처별 회수 조건, 장기체류 정산, 성수기 공급 수량, 세척·선별 기준까지 같은 조건인지 먼저 맞춰 보겠습니다. 회수가 안 되는 만큼이 결국 고객사 부담으로 돌아옵니다.'}];

/* ============================================================
   상태 (세션 한정 — 단가 기본값만 저장)
   ============================================================ */
const Q={
 use:'trans', unitCode:'N11', unitKind:'일반', industry:'식품',
 monthlyOut:10000, season:false, peakMonths:3, peakMult:1.5,
 turnDays:15, startYm:'',
 stock:5000, stockEst:true,
 client:'', endUser:'', biller:'', sameAll:true,
 prevUse:'own', quoteKind:'신규', contractYears:1, creditMemo:'',
 r:rateGet(), monthlyIn:10000, monthlyInEst:true,
 company:'', region:''
};
const OWN={buy:22000, life:3, loss:7, repair:1500, storage:800, ret:400};
let toolTab='fit';
const fitAns={};

/* ============================================================
   계산
   ============================================================ */
const estStock=()=>Math.round(Q.monthlyOut*Q.turnDays/30);
function calcMonth(mult){
 const out=Q.monthlyOut*mult, inn=Q.monthlyIn*mult, st=Q.stock*mult;
 const keepM=st*Q.r.keep*Q.r.days;                 // 보관료: 전산재고 × 원/매/일 × 매일 청구
 const transM=Q.use==='in'?0:out*Q.r.trans;        // 수송비: 출고 매당 (구내용 0)
 const carryM=inn*Q.r.carry;                       // 운반비: 납품(투입) 매당
 return {keepM,transM,carryM,tot:keepM+transM+carryM};
}
function calcRevenue(){
 const base=calcMonth(1);
 let year, annualOut;
 if(Q.season){
  const peak=calcMonth(Q.peakMult), k=Math.min(12,Math.max(0,Q.peakMonths));
  year=base.tot*(12-k)+peak.tot*k;
  annualOut=Q.monthlyOut*(12-k)+Q.monthlyOut*Q.peakMult*k;
 }else{year=base.tot*12; annualOut=Q.monthlyOut*12}
 return {...base, year, annualOut};
}
function fmtEok(n){const e=n/1e8; return (e<0.05?e.toFixed(2):e.toFixed(1))+'억'}
function rateCond(){return `${Q.unitCode} ${Q.r.keep}/${Q.use==='in'?0:won(Q.r.trans)}/${Q.r.carry}`}
function buildSummary(){
 const rev=calcRevenue();
 return `${Q.company||'업체명'} : ${Q.region||'지역'}, ${Q.industry}${Q.unitKind==='건자재'?'(건자재)':''}, ${Q.quoteKind}, `+
  `물동량 ${won(rev.annualOut)}매/년, 예상매출 ${fmtEok(rev.year)}/년 (${rateCond()})`;
}

/* ============================================================
   라우터 · 공통 렌더
   ============================================================ */
const SCREENS=['1','2','3','4','result','tools'];
function cur(){const h=location.hash.replace(/^#\/?/,''); return SCREENS.includes(h)?h:'1'}
window.go=s=>{location.hash='#/'+s};
window.goTool=t=>{toolTab=t; if(cur()==='tools')render(); else go('tools')};
addEventListener('hashchange',render);

const STEPS=[['1','사용형태'],['2','물동'],['3','거래구조'],['4','단가·수익']];
function renderSteps(){
 const s=cur(), idx=+s||9;
 $('#steps').innerHTML=STEPS.map(([n,t])=>
  `<button class="step ${s===n?'on':(idx>+n?'done':'')}" onclick="go('${n}')"><span class="n">${n}</span>${t}</button>`).join('')+
  `<button class="step ${s==='result'?'on':''}" onclick="go('result')"><span class="n">✓</span>결과</button>`+
  `<button class="step ${s==='tools'?'on':''}" onclick="go('tools')"><span class="n">☰</span>도구</button>`;
}
function seg(list,curv,fn){
 return `<div class="seg">`+list.map(([v,t])=>`<button class="${curv===v?'on':''}" onclick="${fn}('${v}')">${t}</button>`).join('')+`</div>`;
}
const NOTE=`<div class="rate-note">⚠ 실제 단가는 <b>최신 단가표를 반드시 확인</b>하세요. 아래 값은 참고용 기본값이며, 회수기한·미회수 정산 기준은 현장에서 임의 확답하지 않습니다.</div>`;
function navbar(prev,next,nextTxt){
 $('#navbar').innerHTML=
  (prev?`<button class="btn prev" onclick="go('${prev}')">← 이전</button>`:'')+
  (next?`<button class="btn next" onclick="go('${next}')">${nextTxt||'다음 →'}</button>`:'');
}

/* ============================================================
   Step 1 — 사용형태
   ============================================================ */
function vStep1(){
 $('#hsub').textContent='1단계 · 사용형태 — 여기서 견적 구조가 갈린다';
 $('#view').innerHTML=`<div class="body">
  ${NOTE}
  <div class="sec-t">사용 형태</div>
  <div class="card calc">
   ${seg([['trans','수송용 (사외 출하)'],['in','구내용 (사업장 내)']],Q.use,'setUse')}

  body=`<div class="card calc">

  <div class="rline"><span>자가 1회전당 (연 ${yearTurns.toFixed(1)}회전)</span><span>${won(ownTrip)}원</span></div>
  <div class="rline"><span>렌탈 1회전당 (${Q.turnDays}일×${Q.r.keep}원${Q.use==='in'?'':' + 수송 '+won(Q.r.trans)+'원'} + 운반 ${Q.r.carry}원)</span><span>${won(rentTrip)}원</span></div>
  <div class="rline">${diff>0?`<span>렌탈 시 회전당 절감</span><b>+${won(diff)}원</b>`:`<span>이 조건에서는 자가가 회전당 유리</span><b style="color:#f0a9a0">${won(diff)}원</b>`}</div>`;
 $('#ownhint').textContent=diff<=0?'자가가 유리한 구간은 먼저 인정하세요 — 내부 고정재고는 유지, 사외 출하 구간만 전환 제안이 신뢰를 만듭니다.':'';
};

/* ============================================================
   렌더 진입
   ============================================================ */
function render(){
 renderSteps();
 const s=cur();
 if(s==='result')vResult();
 else if(s==='tools')vTools();
 else [vStep1,vStep2,vStep3,vStep4][+s-1]();
 window.scrollTo(0,0);
}
render();
</script>
</body>
</html>
