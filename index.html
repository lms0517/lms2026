<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>영업마스터</title>
<meta name="theme-color" content="#0a2d61">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="영업마스터">
<link rel="manifest" href='data:application/manifest+json,{"name":"영업마스터","short_name":"당사영업","display":"standalone","background_color":"%23eef1f6","theme_color":"%230a2d61","start_url":"."}'>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="%230a2d61"/><rect x="12" y="36" width="40" height="8" rx="2" fill="%23f5c344"/><path d="M16 36v-7h8v7M28 36v-7h8v7M40 36v-7h8v7" stroke="%23f5c344" stroke-width="3" fill="none"/><path d="M16 51v-7M32 51v-7M48 51v-7" stroke="%23f5c344" stroke-width="4"/></svg>'>
<style>
:root{
  --navy:#0b3a7c; --navy-d:#0a2d61; --navy-x:#082448; --navy-grad:linear-gradient(160deg,#0a2d61,#0b4da2);
  --gold:#f5c344; --gold-d:#d9a51f; --gold-bg:#f9f1da;
  --bg:#eef1f6; --card:#ffffff; --line:#d9dfeb; --line2:#e4e9f2;
  --txt:#141d33; --sub:#4d5e78; --mut:#8b99ad;
  --blue-l:#e8eef8; --ok:#1e7a46; --ok-bg:#e6f4ec; --warn:#b3341f; --warn-bg:#faeae6;
  --r:10px; --sh:0 2px 10px rgba(10,25,55,.07);
}
*{box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:#dfe4ec; color:var(--txt);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  font-size:15px; line-height:1.55;
}
#shell{max-width:520px; margin:0 auto; min-height:100dvh; background:var(--bg);
  display:flex; flex-direction:column; position:relative; box-shadow:0 0 40px rgba(10,25,55,.12)}
#view{flex:1; display:flex; flex-direction:column; padding-bottom:76px}
a{color:var(--navy)}
button{font:inherit; cursor:pointer; border:none; background:none; color:inherit}
input,select,textarea{font:inherit; color:var(--txt); background:var(--card);
  border:1.5px solid var(--line); border-radius:8px; padding:9px 11px; width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--navy); outline-offset:1px}
input[type=number]{font-variant-numeric:tabular-nums}

/* ---------- 헤더 ---------- */
.hdr{background:var(--navy-grad); color:#fff; padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 18px}
.hdr .brand{font-size:11px; font-weight:800; letter-spacing:.14em; color:var(--gold)}
.hdr h1{font-size:21px; font-weight:800; letter-spacing:-.01em; margin-top:4px}
.hdr .sub{font-size:12.5px; opacity:.78; margin-top:4px}
.hdr .back{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700;
  color:#fff; opacity:.85; margin-bottom:10px; padding:2px 0}
.hdr .back svg{width:13px; height:13px}

/* ---------- 본문 공통 ---------- */
.body{padding:16px 16px 20px; display:flex; flex-direction:column; gap:12px}
.sec-t{font-size:13px; font-weight:800; color:var(--navy); letter-spacing:.02em;
  display:flex; align-items:center; gap:7px; margin-top:4px}
.sec-t::after{content:""; flex:1; height:1px; background:var(--line)}
.card{background:var(--card); border:1px solid var(--line2); border-bottom:2.5px solid var(--line2);
  border-radius:var(--r); box-shadow:var(--sh)}
.hint{font-size:11.5px; color:var(--mut)}

/* ---------- 메인: 사업분야 ---------- */
.bizgrid{display:grid; grid-template-columns:1fr 1fr; gap:11px}
.bizc{padding:15px 13px 13px; display:flex; flex-direction:column; gap:9px; text-align:left}
.bizc .ic{width:38px; height:38px; border-radius:8px; display:grid; place-items:center;
  background:var(--blue-l); color:var(--navy)}
.bizc b{font-size:14.5px; letter-spacing:-.01em; color:#14264a}
.bizc span{font-size:11px; color:var(--sub); line-height:1.4}
.bizc .tag{font-size:10px; font-weight:800; color:var(--gold-d); letter-spacing:.08em}

/* ---------- 사업 상세 ---------- */
.cat{padding:14px; display:flex; align-items:center; gap:12px; width:100%; text-align:left}
.cat .cic{width:36px; height:36px; border-radius:8px; display:grid; place-items:center;
  background:var(--blue-l); color:var(--navy); flex:0 0 auto}
.cat b{font-size:15px; display:block}
.cat small{font-size:11.5px; color:var(--sub); display:block; margin-top:2px}
.cat .chev{margin-left:auto; color:var(--mut); flex:0 0 auto}
.cat-sub{display:grid; grid-template-columns:1fr 1fr; gap:9px; padding:0 14px 14px}
.sb{border:1.5px solid var(--line); background:var(--bg); border-radius:8px; padding:11px 8px;
  text-align:center; font-size:13px; font-weight:700; color:var(--txt);
  display:flex; align-items:center; justify-content:center; gap:7px}
.cta{background:var(--navy-grad); color:#fff; border-radius:var(--r); padding:15px 14px;
  display:flex; align-items:center; gap:12px; width:100%; text-align:left; box-shadow:var(--sh)}
.cta .cic{width:36px; height:36px; border-radius:8px; background:rgba(255,255,255,.16);
  display:grid; place-items:center; flex:0 0 auto}
.cta b{font-size:15px; display:block}
.cta small{font-size:11.5px; color:var(--gold); display:block; margin-top:2px}
.cta .chev{margin-left:auto; color:#fff; opacity:.8}

/* ---------- 콘텐츠 페이지 (스킬/체크) ---------- */
.acc{overflow:hidden}
.acc summary{list-style:none; padding:13px 14px; font-size:14.5px; font-weight:800;
  display:flex; align-items:center; gap:8px; cursor:pointer}
.acc summary::-webkit-details-marker{display:none}
.acc summary .chev{margin-left:auto; color:var(--mut); transition:transform .18s}
.acc[open] summary .chev{transform:rotate(90deg)}
.acc .cbody{padding:0 14px 14px; font-size:13.5px; color:var(--txt); white-space:pre-wrap; line-height:1.66}
.acc .cbody p{margin-bottom:8px}
.chk{display:flex; gap:10px; align-items:flex-start; padding:11px 14px; border-top:1px solid var(--line2)}
.chk:first-of-type{border-top:none}
.chk input{width:19px; height:19px; margin-top:2px; accent-color:var(--navy); flex:0 0 auto}
.chk span{font-size:13.5px; line-height:1.5}
.chk input:checked + span{color:var(--mut); text-decoration:line-through}
.chkbar{display:flex; align-items:center; gap:10px; padding:12px 14px}
.chkbar .prog{flex:1; height:7px; border-radius:99px; background:var(--line2); overflow:hidden}
.chkbar .prog i{display:block; height:100%; background:var(--navy); border-radius:99px; transition:width .2s}
.chkbar b{font-size:12.5px; color:var(--navy); font-variant-numeric:tabular-nums}

/* ---------- 버튼 ---------- */
.btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
  padding:13px; border-radius:9px; font-size:14.5px; font-weight:800}
.btn.pri{background:var(--navy); color:#fff}
.btn.pri:active{background:var(--navy-x)}
.btn.gold{background:var(--gold); color:#3d2e05}
.btn.ghost{border:1.5px solid var(--line); background:var(--card); color:var(--navy)}
.btnrow{display:grid; grid-template-columns:1fr 1fr; gap:9px}

/* ---------- 견적 계산기 ---------- */
.calc{padding:14px; display:flex; flex-direction:column; gap:11px}
.fi label{font-size:12px; font-weight:800; color:var(--sub); display:block; margin-bottom:5px}
.fi .unit{font-weight:600; color:var(--mut)}
.frow{display:grid; grid-template-columns:1fr 1fr; gap:9px}
.result{background:var(--navy-grad); color:#fff; border-radius:var(--r); padding:16px 15px}
.result .rl{font-size:11.5px; letter-spacing:.06em; color:var(--gold); font-weight:800}
.result .rv{font-size:26px; font-weight:800; margin-top:3px; font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.result .rs{font-size:12px; opacity:.85; margin-top:6px; line-height:1.6; font-variant-numeric:tabular-nums}
.rline{display:flex; justify-content:space-between; gap:10px; font-size:13px; padding:7px 0;
  border-top:1px dashed var(--line); font-variant-numeric:tabular-nums}
.rline b{font-variant-numeric:tabular-nums}
.rate-note{background:var(--gold-bg); border:1px solid #eed9a0; border-radius:8px;
  padding:9px 11px; font-size:11.5px; color:#6b5310; line-height:1.55}
.applink{display:flex; align-items:center; gap:11px; padding:13px 14px; text-decoration:none}
.applink .cic{width:34px; height:34px; border-radius:8px; background:var(--gold-bg); color:var(--gold-d);
  display:grid; place-items:center; flex:0 0 auto}
.applink b{font-size:14px; display:block; color:var(--txt)}
.applink small{font-size:11.5px; color:var(--sub)}
.applink .chev{margin-left:auto; color:var(--mut)}

/* ---------- 업체 ---------- */
.seg{display:flex; background:#e2e8f2; border-radius:9px; padding:3px; gap:3px}
.seg button{flex:1; text-align:center; font-size:13px; font-weight:700; padding:8px 4px;
  border-radius:7px; color:var(--sub)}
.seg button.on{background:var(--card); color:var(--navy); box-shadow:0 1px 4px rgba(10,25,55,.14)}
.mapbox{border-radius:var(--r); overflow:hidden; border:1px solid var(--line2); position:relative; background:#e7ece7}
.mapbox .me{position:absolute; left:50%; top:55%; transform:translate(-50%,-50%); width:14px; height:14px;
  border-radius:50%; background:var(--navy); border:3px solid #fff; box-shadow:0 0 0 7px rgba(11,58,124,.18)}
.pin{position:absolute; transform:translate(-50%,-100%)}
.corp{padding:12px 14px; display:flex; align-items:center; gap:11px; width:100%; text-align:left}
.corp .dist{font-size:11px; font-weight:800; color:var(--navy); background:var(--blue-l);
  border-radius:999px; padding:4px 9px; flex:0 0 auto; font-variant-numeric:tabular-nums; min-width:52px; text-align:center}
.corp b{font-size:14px; display:block}
.corp small{font-size:11.5px; color:var(--sub); display:block; margin-top:1px}
.corp .src{margin-left:auto; font-size:10px; font-weight:800; padding:4px 8px; border-radius:6px; flex:0 0 auto}
.src.in{background:var(--blue-l); color:var(--navy)}
.src.out{background:var(--ok-bg); color:var(--ok)}
.kwrow{display:flex; gap:7px; flex-wrap:wrap}
.kw{font-size:12.5px; font-weight:700; padding:7px 12px; border-radius:999px;
  background:var(--card); border:1.5px solid var(--line); color:var(--navy)}

/* ---------- 지식 ---------- */
.srch{display:flex; align-items:center; gap:9px; background:var(--card); border:1.5px solid var(--line);
  border-radius:9px; padding:2px 12px}
.srch input{border:none; padding:9px 0}
.srch input:focus{outline:none}
.srch svg{color:var(--mut); flex:0 0 auto}
.chips{display:flex; gap:7px; flex-wrap:wrap}
.chips button{font-size:12.5px; font-weight:700; padding:6px 12px; border-radius:999px;
  background:var(--card); border:1.5px solid var(--line); color:var(--sub)}
.chips button.on{background:var(--navy); border-color:var(--navy); color:#fff}
.kn{padding:13px 14px}
.kn .tag{font-size:10.5px; font-weight:800; color:var(--gold-d); letter-spacing:.06em}
.kn b{font-size:14px; display:block; margin-top:2px}
.kn .kb{font-size:13px; color:var(--sub); margin-top:4px; line-height:1.6; white-space:pre-wrap}

/* ---------- 하단 탭 ---------- */
#tabbar{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:520px;
  background:var(--card); border-top:1px solid var(--line);
  display:flex; padding:7px 6px calc(env(safe-area-inset-bottom,0px) + 9px); z-index:40}
#tabbar button{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  font-size:10.5px; font-weight:800; color:var(--mut); padding:4px 0}
#tabbar button.on{color:var(--navy)}
#tabbar button.on svg{color:var(--navy)}

/* ---------- 시트/모달 ---------- */
#sheetbg{position:fixed; inset:0; background:rgba(8,16,32,.45); z-index:60; display:none}
#sheetbg.on{display:block}
#sheet{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:520px;
  background:var(--card); border-radius:16px 16px 0 0; z-index:61; display:none;
  padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 18px); max-height:82dvh; overflow-y:auto}
#sheet.on{display:block}
#sheet h3{font-size:16px; font-weight:800; margin-bottom:4px}
#sheet .ssub{font-size:12.5px; color:var(--sub); margin-bottom:14px}
.qrbox{display:grid; place-items:center; padding:14px; background:#fff; border:1px solid var(--line);
  border-radius:10px; margin:0 auto 12px; width:fit-content}
#toast{position:fixed; bottom:96px; left:50%; transform:translateX(-50%); background:var(--navy-x); color:#fff;
  font-size:13px; font-weight:700; padding:10px 18px; border-radius:99px; z-index:80; display:none; white-space:nowrap}

@media (prefers-reduced-motion: no-preference){
  .fadein{animation:up .3s ease both}
  @keyframes up{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
}
</style>
</head>
<body>
<div id="shell">
  <div id="view"></div>
  <nav id="tabbar" aria-label="주요 메뉴"></nav>
</div>
<div id="sheetbg"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div>

<script>
/* ============================================================
   영업마스터 v3 — 사업 · 업체 · 지식
   시안 C(네이비 프리미엄) 기반 / 단일 파일 / GitHub Pages
   ============================================================ */

/* ---------- 아이콘 ---------- */
const I={

box:'<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></svg>',
globe:'<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.5 3.9 5.5 3.9 9S14.6 18.5 12 21c-2.6-2.5-3.9-5.5-3.9-9S9.4 5.5 12 3z"/></svg>',

send:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3L10 14M21 3l-7 18-4-7-7-4 18-7z"/></svg>',
spark:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.6L20 10l-6.1 1.4L12 17l-1.9-5.6L4 10l6.1-1.4L12 3z"/><path d="M18.5 16.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2z"/></svg>',
check:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12.5l2.5 2.5 4.7-5.5"/></svg>',

chev:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',

book:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15.5H6.5A2.5 2.5 0 0 0 4 21z"/><path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H20"/></svg>',
kase:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7.5" width="18" height="12" rx="2.5"/><path d="M9 7.5V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v1.5M3 12.5h18"/></svg>',

copy:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>'
};

/* ---------- 사업분야 ---------- */
const BIZ=[
 {k:'s1', tag:'S1', n:'공유시스템사업', s:'표준 유니트·접이식컨테이너/IBC 공동이용(렌탈)', ic:I.pallet},

  ['핵심 영업 스킬','· 도입효과 4가지: 초기 투자 0 / 성수기 물량 탄력 대응 / SZ-A·SZ-B 표준화로 하역·적재 효율 / 회수·수리·세척 당사 전담\n· TCO 논법: 자가 유니트 총비용 = 구매가 + 연 수리비 + 분실 손실 + 관리 인건비 + 보관 공간. 렌탈료만 비교하면 지는 싸움 — 반드시 총소유비용으로 비교 제안.\n· 회수율이 곧 원가: 거래처 반납 체계(회수 전담)까지 설계해 주는 것이 당사의 차별점.'],

 s2:/*@S2_SKILL*/[["한 줄 피치(소개)","운영은 저희가 맡고, 고객은 본업에 집중하시면 됩니다. 원부자재 조달부터 보관·운송·판매·회수까지 운영 전 범위를 위탁 운영하는 계약운영(위탁운영) 사업입니다. 전국 17개 공동운영센터와 상온·저온 인프라, 35만 고객 네트워크를 기반으로 운영합니다.\n\n\"운영 인력과 창고를 직접 늘리지 않고도 물량 증가를 감당하실 수 있습니다. 고정비로 안고 계신 운영을 변동비로 바꾸는 겁니다.\""],["핵심 영업 스킬","[고객 상황 → 우선 제안]\n· 자체 창고·인력 운영 부담 → 위탁운영 위탁(유통운영)\n· 온라인 주문 급증·출고 지연 → 이커머스 풀필먼트\n· 가맹점 배송 편차·클레임 → 프랜차이즈 운영\n· 중량물·비정형 화물 → 산업재 운영\n· 물량이 적어 단독 배송이 비효율 → 공동운영(17개 거점 공동 배송망)\n· 운영 구조 자체를 모르겠다 → 4PL·운영 컨설팅 진단부터\n\n[상담 4단계]\n1. 현재 구조 파악 — 자가 운영인지 위탁인지, 창고 위치·면적, 인력 수\n2. 물량·특성 확인 — 월 물동량, 피크 편차, 온도대(상온/저온), SKU 수\n3. 비용 구조 열기 — 창고 임차료·인건비·운송비·재고 손실을 각각 분리\n4. 총비용으로 닫기 — 월 위탁비 하나로 묶었을 때의 비교\n\n[핵심 논리]\n· 고객은 대개 \"운송비\"만 비교하려 한다. 창고 임차료·인건비·관리 인력·재고 손실까지 끌어내야 위탁운영이 이긴다\n· 피크 대응이 강력한 무기다 — 성수기에만 인력·공간을 늘릴 수 없다는 점을 짚을 것\n· 유니트 공유(S1)을 이미 쓰는 고객이면 연계 제안이 쉽다"],["클레임 대응","[Q. 지금 우리가 하는 게 더 싸지 않나요?]\n\"창고 임차료와 인건비, 관리 인력까지 넣어서 비교해 보시면 다릅니다. 항목별로 나눠 비교표를 만들어 드리겠습니다.\" — 운송비 단건 비교로 끌려가지 말 것.\n\n[Q. 우리 물건을 남한테 맡기는 게 불안합니다]\n재고 실시간 조회와 정기 리포트, 사고 책임 범위를 계약서에 명시하는 것으로 답한다. 말로만 안심시키지 말 것.\n\n[Q. 성수기에 감당 되나요?]\n\"피크 물량 기준으로 설계합니다. 평균이 아니라 최대치를 알려주셔야 합니다.\" — 평균 물량으로 설계하면 반드시 사고가 난다.\n\n[Q. 지금 쓰는 운영사에서 옮기는 게 부담됩니다]\n이관 일정과 병행 운영 기간을 먼저 제시한다. 재고 실사 시점과 책임 인계 지점을 문서로 남길 것.\n\n[운영 중 클레임 예방]\n· 오출고·파손은 초기 3개월에 집중된다 — 이 기간 리포트 주기를 짧게 가져갈 것\n· 컷오프 시간 변경, 물량 급증은 사전 통보 조건을 계약에 넣을 것\n· 반품 처리 범위를 계약 전에 명확히 하지 않으면 반드시 분쟁이 된다\n\n[에스컬레이션]\n운영 조건·단가는 계약운영 부문 확인 후 회신한다. 현장에서 임의로 확답하지 않는다.\n\n[출처] 당사 자료 계약운영사업 소개 — 상세자료 확보 시 보강 예정"]],
 ind:/*@IND_SKILL*/[["한 줄 피치(소개)","산업자재유통은 포장자재(스트레치필름·골판지박스·테이프·스티로폼·비닐)와 유니트 판매(목재/플라스틱)를 한 창구에서 공급합니다.\n\n[유니트 판매]\n목재는 규격 자유도, 플라스틱은 반복사용 경제성입니다.\n\n\"1회성·특수규격·수출포장이면 목재로 규격을 맞춰 제작하고, 반복사용·위생·표준화가 필요하시면 플라스틱으로 회당 비용을 낮추는 방향이 맞습니다. 사용환경 기준으로 두 안 다 비교해서 정리해 드리겠습니다.\""],["핵심 영업 스킬 — 유니트(목재/플라스틱)","[고객 상황 → 우선 제안]\n· 특수규격·수출포장·중량물 → 목재유니트\n· 반복사용·위생관리·세척 → 플라스틱 유니트\n· 저중량·단가민감·일회성 → PP\n· 저온·냉동창고·충격 많음 → PE\n· 색상구분·위생성·장기반복 → 신재 PE\n\n[상담 4단계]\n1. 사용환경 확인 — 1회성인가 반복인가 / 온도 / 랙 적재\n2. 방향 제시 — 목재냐 플라스틱이냐\n3. 총비용으로 닫기 — 단품 단가가 아니라 회당 비용\n4. 견적 조건 예고 — 도착지·수량·차량에 따라 변동\n\n※ 4단계를 생략하면 나중에 운반비로 단가가 오를 때 신뢰를 잃는다."],["클레임 대응 — 유니트(목재/플라스틱)","[Q. 운반비 포함 단가인가요?]\n\"전달드린 단가는 도착도 기준 매입가입니다. 수익률을 반영해 견적가로 안내드리겠습니다.\"\n\n[Q. 도착지가 달라지면 단가도 달라지나요?]\n\"도착지가 변경되면 운반비가 달라져 실매입가가 변동될 수 있습니다. 변경된 도착지 기준으로 재확인하겠습니다.\"\n\n[Q. 수량이 달라지면요?]\n\"수량이 줄거나 늘면 매당 운반비가 달라져 단가가 변동될 수 있습니다. 실제 수량 기준으로 재산정하겠습니다.\"\n\n[파손 클레임 예방]\n랙 적재 고객은 반드시 랙하중 기준으로 확인하고 제안할 것.\n수출 건은 ISPM-15 대응 가능 여부를 매입처에 먼저 확인할 것."]],
 glo:[
  ['한 줄 피치','"수출 유니트, 일회용 목재 대신 S3로 — 훈증 없이, 현지 회수까지."'],
  ['핵심 영업 스킬','· 도입효과: ISPM-15 훈증 불필요(플라스틱) / 해외 현지 회수 네트워크 / 편도(One-way) 요금제로 회수 리스크 제거 / 컨테이너 적입 효율\n· 총비용 비교: 목재 단가에 훈증비 + 검역 리스크 + 현지 폐기비를 더해 비교하면 S3가 역전되는 구간을 제시.'],

 s5:/*@S5_SKILL*/[["한 줄 피치(소개)","장비는 사는 물건이 아니라 쓰는 서비스입니다. 국내 최대 규모인 약 22,500대의 장비 임대를 운영하며, 장비 공급뿐 아니라 정기점검·예방정비, 안전장치, 배터리·충전 인프라, 계약 종료 장비의 중고 유통(로지스마트옥션)까지 한 묶음으로 제공합니다.\n\n\"장비만 빌려드리는 게 아니라 가동률을 빌려드립니다. 고장 나면 라인이 멈추는 리스크까지 저희가 맡습니다.\"\n\n※ 운영 주체는 당사(KLP) 운영장비 부문 · 문의 1800-5540"],["핵심 영업 스킬 — 장비 임대","[고객 상황 → 우선 제안]\n· 디젤 사용 + 실내작업·매연/소음 민원 → 전동 전환(리튬) 검토\n· 납산 전동 + 2~3교대로 배터리 교체 부담 → 리튬 전환(기회충전)\n· 좁은 통로 + 고층 랙 → 삼방향(VNA) / 리치트럭\n· 피킹 중심 다품종 → 오더피커\n· 성수기·단기 프로젝트 → 단기 임대\n· 사고·안전 부담 → AI 인체인식 카메라 · 후방/포크 카메라 · 지문인식 시동장치\n· 노후 자가 장비 처분 고민 → 로지스마트옥션 매각 또는 중고 직접 매입 연계\n\n[상담 4단계]\n1. 현장 조건 확인 — 톤수 / 인상높이 / 통로폭 / 실내외 / 가동시간(교대)\n2. 동력 방식 결정 — 디젤·LPG / 납산 전동 / 리튬(LFP)\n3. 충전 인프라 확인 — 전동 제안은 여기서 막히면 계약이 늦어진다\n4. 총비용으로 닫기 — 월 임대료가 아니라 연료·전기·정비·다운타임까지\n\n[리튬 전환을 말하는 법]\n· 전환 경로는 둘 — ①디젤 → 리튬 ②납산 전동 → 리튬\n· 강점은 기회충전: 식사·휴게 중 충전이 가능해 배터리 교체와 예비 배터리가 사라진다 → 피크타임 대응력·가동률\n· 배터리 교체 인력·충전실 공간·교체 시간까지 금액으로 환산해서 비교할 것\n· 초기 비용만 비교하면 무조건 진다. 반드시 총소유비용(TCO)으로 옮길 것"],["클레임 대응 — 장비 임대","[Q. 사는 게 더 싸지 않나요?]\n\"구매는 취득가만 보이지만 정비·배터리·다운타임·처분까지 회사가 다 안게 됩니다. 임대는 그 변동비를 고정비로 바꾸는 겁니다. 3년·5년 총비용 비교표로 정리해 드리겠습니다.\"\n\n[Q. 고장 나면 우리 라인이 멈춥니다]\n\"정기점검·예방정비 주기와 고장 시 출동·대차 기준을 계약에 넣어 드립니다. 여름·겨울 계절 점검 항목은 따로 관리합니다.\"\n\n[Q. 리튬 배터리, 안전한가요?]\nLFP(리튬인산철) 기준으로 설명하되, 확답이 어려운 부분은 즉답하지 말고 현장 실사로 넘길 것. 충전기·배전 조건 사전 점검이 답이다.\n\n[Q. 전기공사 비용은 누가 냅니까?]\n\"먼저 단상충전기로 가능한 조건인지부터 확인합니다. 소형·단기·야간충전 현장이면 별도 공사 없이 끝나는 경우가 많습니다.\"\n\n[파손·분쟁 예방]\n· 어태치먼트로 밀기·바닥 긁기 작업을 하면 충격이 누적돼 고장과 소모가 늘고 반납 시 분쟁이 된다 — 계약 전 실제 작업 방식을 확인할 것\n· 반납 기준(원상복구·마모·손상)은 계약 시점에 문서로 합의할 것\n· 중고 거래 건은 건설기계 등록 상태와 소유 이력을 반드시 확인\n\n[사고 발생 시]\n장비 사고는 인명 이슈다. 즉시 상위 보고하고 현장에서 임의 합의하지 말 것.\n\n[출처] 당사 운영장비 블로그 (사내 자료) (2026년 게시글 기준) · 문의 1800-5540"]],
 s4:/*@S4_SKILL*/[["한 줄 피치(소개)","S4는 그룹사의 스마트 운영 핵심역량인 컨설팅(Consulting) · 엔지니어링(Engineering) · 시스템즈(Systems)를 포괄하는 운영 혁신 사업입니다. 운영 컨설팅 기반의 엔지니어링에 IT 운영 시스템을 융합해 제공합니다.\n\n· C 컨설팅 — Diagnosis · 운영 수준 진단\n· E 엔지니어링 — Design · 자동화 솔루션 설계\n· S 시스템즈 — Deploy · 시스템 구축 및 변화관리\n\n[목표] DX 기반 스마트 운영 시장 선점 및 핵심 리딩 브랜드 도약\n[전략] 차별화된 스마트 운영역량 강화 · 맞춤형 고객경험 제공 · S4 융합기반 시너지 효과 창출\n\n\"설비 한 대를 파는 게 아니라, 진단 → 설계 → 구축을 묶어서 드립니다. 그래서 넣고 나서 안 물리는 일이 없습니다.\""],["시장 변화와 차별화 포인트","[왜 지금 S4인가]\n고객 Needs가 다양해지고 기술/DATA 중심의 DT 현상이 가속화되고 있습니다. Logistics 4.0 시대의 운영 기술 혁신으로 최적화·자동화·지능화 Needs가 커지고 있습니다.\n\n· 고객니즈 — Needs의 단순화 → Needs의 다양화\n  경쟁 심화로 고객의 서비스 요구가 확대되고, 운영 사업의 구조적 경쟁력이 필요해졌다\n· 시장환경 — 노동/경험 중심 → 기술/DATA 중심 디지털 운영\n  전통 방식은 사업경쟁력의 한계가 드러났고, Data 기반 디지털 기술 역량이 필요하다\n\n[우리만의 차별화 3가지 — 고객에게 이 순서로 말한다]\n1. 최적화 — 유니트·컨테이너 공유(7천만매) 서비스와 위탁운영 운영 노하우를 바탕으로 S4 기반 고객 맞춤형 운영 최적화 솔루션 제공\n2. 자동화 — 제조공장·운영센터 자동화 솔루션과 AGV/AMR 로봇 기술에 대해 제조·설계·구축·유지보수까지 Vertical Full Service 제공\n3. 지능화 — 20만 거래처 Big-Data와 고객사 정보 연계성 강화로 업무 효율성과 고객 가치 향상\n\n※ 경쟁사는 설비만, SI는 시스템만 판다. 우리는 진단부터 유지보수까지 한 회사 안에서 끝난다 — 이게 유일한 차별점이다."],["C · 컨설팅사","선진 운영 기술, 운영 운영 최적화, 엔지니어링 설계가 결합된 서비스를 제공하는 운영전문가 그룹입니다.\nGROUP Consulting — Industry 4.0 Generation S2 Innovation Partner\n\n[4대 핵심 역량 — 이 4개로 기억한다]\n① Network Optimization\n · 운송 배차 업무 통합 관리 효율화\n · 배송 라우팅 개선 및 통합 시너지\n · 거점 전략 개선을 통한 간선 효율화\n② Operational Excellence\n · 생산 공장 내 운영 보관·운영 최적화\n · RDC 보관 및 분류, 배차 관리 효율화\n · 센터 Lay-out 변경 및 매출 확대 전략\n③ Center Design & Lay-out\n · 신규 센터 건축 및 Lay-out 설계\n · 신규 사업·확장을 고려한 유기적 설계\n · 사업 전략에 대응 가능한 센터 모델링\n④ Smart Packaging\n · 최적의 패키징 표준화 전략 수립\n · 사용자 관점의 제품 설계 및 개발\n · 全 산업군 스마트 패키징 솔루션 적용\n\n[S2 Consulting]\nS2 진단과 프로세스 효율화, 수배송 거점화 및 배송 네트워크 Optimization, 운영 전략·조직 진단 등 최적 S2 운영을 위한 종합 솔루션을 제공합니다.\n· 분야별 전문 인적 자원 — 산업별 10년 이상 경험의 석·박사급 조직\n· 컨설팅 방법론 CM1 — 독자 개발한 Advanced Logistics Intelligent Suite 보유\n· 최적화/설계 검증 Tool — 3D Simulation, BI Tool로 설계·배치를 시각화해 새 운영방식 검증\n\n[서비스 영역 — 공급망 전체 커버]\nSupplier → PLANT → RDC → CDC / Fulfillment → Agent → Customer\n· 원부자재 조달·생산 관리 — 생산계획 기준 조달 운송·보관·투입 동선 정의, 공장 내 동선·공간 기반 보관/출고 프로세스 정립\n· 운영센터 內 운영 프로세스 — 보관, 입출고 관리, 공정 자동화 설비, 자원 관리, 거점·배송 라우팅 분석\n· 對고객 서비스 품질 향상 — B2C 대응 전략 도입, 시스템 운용과 DT 대시보드 기반 실시간 관리\n\n[주요 고객사]\n· 고객사명은 대외 비공개다. 본부 레퍼런스 자료를 확인할 것."],["C · 컨설팅 방법론 CM1","컨설팅사의 독자적인 컨설팅 방법론입니다. 여러 프로젝트를 통해 기존 경영 컨설팅과 차별화된 \"실행 중심\"의 운영 컨설팅 서비스를 제공합니다.\n\nCM1 — 자체 컨설팅 방법론\n\n[8개 모듈]\n① CM1-FF (Fundamental Frame) — CM1 개요\n② CM1-EA (Environment Analysis) — 환경 분석\n③ CM1-HC (Health Check) — 수준 진단\n④ CM1-WD (Warehouse Design) — 센터 설계 구축\n⑤ CM1-ND (Network Design) — 네트워크 설계\n⑥ CM1-WO (Warehouse Optimization) — 센터 운영 개선\n⑦ CM1-TO (Transport Optimization) — 운송 최적화\n⑧ CM1-ULS (Unit Load System) — 운영 표준화\n\n[Source — 무엇을 보고 진단하나]\n· Signal — 운영산업, 운영동향, 업계동향, 유가동향, 고객 기업 동향\n· Channel — 경제 / 원료 / 산업 / 운영 / S2 정보 채널\n\n[활용 방안]\n· Support — 경제동향, 산업정보, 산업동향, 시장정보, 벤치마킹\n· Toolkit — 신용어, 교육자료, Template, Program\n\n[방법론 특징 3가지]\nExpansion(확장성) · Agile(신속성) · Modularity(모듈화)\n\n※ 영업 포인트: \"컨설팅 받아봤자 보고서만 남는다\"는 고객에게 쓰는 카드다. 모듈화되어 있어 필요한 것만 골라 짧게 할 수 있고(Agile·Modularity), 진단(HC)만 먼저 해보자고 제안할 수 있다."],["C · 네트워크 거점·라우팅 최적화","운영비용 중 가장 높은 비율을 차지하는 수배송 네트워크를 최적화하는 솔루션입니다.\n\n[네트워크 최적화 로직]\n운영거점 시나리오를 수립하고 차량운영 효율성과 운영비(차량 & 센터)를 비교 분석해 최적 운영거점을 선정합니다.\n1. 현 거점 운영 현황 분석\n · B2B/B2C 거래처 및 주문 발생 지역 분포도 분석\n · 현 거점 기준 거래처별 거리 및 운영비 발생 현황 분석\n · 물동량 대비 적정 거점 수 검토\n2. 대안 거점 시나리오 구성\n · N개의 운영 거점 시나리오 구성\n · 시나리오별 운영비 및 제약요인 분석\n · B2C & B2B 서비스 대응을 감안한 시나리오 구성\n3. 현 거점 vs 대안 모델 비교\n · 제약 요인(현실)을 반영한 대안별 비교 분석\n · 제약요인의 극복 가능성 검토\n · 현 거점과 대안 거점의 운영 효과 비교\n→ 최적의 대안 모델 선정\n\n[Log-Hub Network 시뮬레이션]\n네트워크 분석 전용 소프트웨어로 운영 거점 최적 시나리오를 사전 모델링하고, 각 거점의 배송 라우팅에 대해 적재율·회전율을 감안한 시나리오를 제공합니다.\n· Phase I. 물량 분석 — 거점 물동량 분포, 거점별 운영비·차량 운영 현황, 배차실적 및 역운영 분석\n· Phase II. 거점 수·위치 최적화 — 시나리오 거점/대안 수립, 거점 수 변화별 수배송비, 거점 수 변화별 센터 운영비\n· Phase III. 배송 권역 최적화 — 각 거점별 최종 배송권역 선정, 시나리오별 운영비 절감액 산정\n\n※ 고객이 \"거점을 늘려야 하나 줄여야 하나\" 고민 중이면 바로 이 카드다. 결과물이 절감액(금액)으로 나오기 때문에 설득이 쉽다."],["C · 센터 운영 최적화 · Lay-out · 3D 검증","[운영센터 운영 및 수배송 최적화]\n작업 프로세스와 시간별 물동량 흐름을 감안해 적정 보관량을 산정하고, 제품 특성에 맞는 센터 운영·수배송 최적화 솔루션을 제공합니다.\n· 운영센터 운영 개선 — 프로세스 비효율 개선 방안 수립 / 운영 운영 정책 변경을 통한 작업 효율화 / 출고회전율을 고려한 재고 재배치 전략\n· 수배송 운영 최적화 — 배송 라우팅 최적화 / 복화운송 방안 수립을 통한 비용 효율화 / 지입 간선차량 활용 및 차량 대형화\n· 관리체계 개선 — 운영센터 운영 표준화 체계 수립 / MS1 활용 운영 고도화 / 운영 부자재 단가 경쟁력 분석\n\n[운영센터 Lay-out 설계]\n센터 설계 및 장비·설비 분야의 전문 Engineering 역량을 보유하고, 제품 특성과 작업 동선 등 고객의 운영 특성을 고려해 인프라 구축을 지원합니다.\n· 출하 특성 — 출고빈도(배차 빈도), 출하량(Qty/CBM), 아이템별 출하 특성\n· 재고 특성 — 현 재고량/안전재고량, 재고회전율, 아이템별 재고분포 특성\n→ 상호 연관이 높은 모듈로 구분: 사람·이동 장비의 접촉 정도 / 같은 사람·장소의 업무 / 공통 설비·기록의 사용 / 업무흐름상 작업 연속성 / 업무흐름상 작업 병합 / 보관 효율 향상 가능성 / 관리 효율 향상 필요성\n\n[3D 시뮬레이션 및 시각화]\n· 3D 모델링 Tool \"FlexSim\" — 신규 설비·장비를 3D로 시각화하고 알고리즘 분석으로 검증\n · 자동화 센터 3D 모델링 / 장비 운영 알고리즘 기반 검증 / 장비 생산성 및 가동률 분석\n· 3D Visualization(스케치업) — 컨설팅 과정에서 현황 분석, 설비 도입 예상도, Lay-out 배치의 이해도를 높임\n · 전체 현황 시각화 / 도입 장비 사전 이해 / 창고 내 동선 이슈 분석 / 신규 운영 방식 시각화\n\n※ 3D 검증은 결재권자를 설득하는 무기다. 도면과 숫자만으로 승인 안 나던 건이 시각화 자료로 통과되는 경우가 많다 — 의사결정이 막힌 고객에게 먼저 꺼낼 것."],["E · 엔지니어링사","자동화 시스템 설계 및 구축 서비스를 제공하는 운영 / 스마트팩토리 자동화 전문 기업입니다.\n\n[회사 개요]\n· 설립 1991년 12월 (2022.01 그룹사 계열사 편입, 2022.10 사명 변경)\n· 본사 서울 마포구 마포대로 63-8 / 공장 경기도 김포시 학운산단2로 53-2\n· 주요사업 — 스마트 팩토리(2차전지·자동차 등) / 스마트 로지스틱스(운영센터·운영창고) / 융·복합 로봇(AGV·AMR, 무인장비, (디)유니타이저)\n· 보유 자격 — 전문건설업등록(기계설비공사업, 2018), 기업부설연구소(2013), ISO9001(2013), 벤처기업확인\n\n※ 35년 업력의 제조 기반 회사다. \"그룹사가 갑자기 자동화 하는 거 아니냐\"는 의심에 이 연혁으로 답한다.\n\n[3대 사업 분야]\n① 스마트 팩토리 — 최첨단 설비 기반의 고객 맞춤형 자동화\n · 2차전지 / 자동차 / 스마트팜·제지 분야 자동화 시스템\n · 적용기술: Stacker Crane 기반 자동창고, Pallet·Tote·Box 이송 자동화, 생산제품 이송·반송 시스템\n② 스마트 로지스틱스 — 스마트운영센터 설계 및 구축\n · B2B2C 이커머스 / D2C 이커머스 / B2B 프랜차이즈\n · 적용기술: Automated Guided Equip, Shuttle System(Pallet·Box), 피스 분류 및 보관 효율화 솔루션\n③ 융·복합 로봇 — 로봇 시스템 설계·공급 및 관리 서비스\n · 이커머스 / 편의점 운영 / 어패럴 분야 자동화 시스템\n · 적용기술: QR AGV 활용 GTP 방식 솔루션, 오더·토탈 피킹 지원 AMR, (디)유니타이저, 피스 피킹 로봇\n\n[강점 3가지]\n· 운영센터 설계 서비스 — 센터 Lay-out, 보관·분류 등 운영 관련 전 영역 분석과 설계\n· 자동화 설비/장비 최적화 — 고객사 현장에 맞게 최적화해 생산성 개선\n· 최신 기술·운영 로봇 도입 지원 — 선도 기술의 현장 적용 검토부터 도입 후 관리까지"],["E · 5대 솔루션","고객의 요구사항과 현장 조건에 따라 다양한 운영 자동화 장비·설비 기반의 솔루션을 제공합니다.\n\n① 융·복합 로봇\n고객사 주문 특성에 최적화되고 물동량 변화에 유연하게 대응 가능한 최신 모바일 솔루션의 설계·구축·유지보수 서비스\n · 물동량 증감 대응형 피킹 AGV\n · 작업자 협업형 AMR\n · (디)유니타이저 로봇\n\n② 디지털 트윈\nAI 최적화 알고리즘 기반으로 스마트 운영센터의 설계·운영·관제·유지보수를 통합하는 All-In-One 서비스\n · 다기종 로봇/설비 시뮬레이션\n · 최적화 알고리즘 기반 피킹/분류\n · AI 기반 예지정비 최적화 시스템\n\n③ 지능형 IoT\n모든 디바이스를 IoT로 연결하고 수집 데이터를 기반으로 실시간 안전·운영 데이터를 제공하는 서비스\n · 장비 속도제어 시스템\n · 작업지원형 웨어러블 슈트\n · 모빌리티 운영 최적화 시스템\n\n④ 스마트 팩토리 & 자동창고\n물동량 분석을 통한 맞춤형 설계 전략으로 최첨단 자동화 설비 기반의 스마트팩토리·자동창고를 구축하는 최적화 서비스\n · 생산·보관 연계형 자동화 설비\n · 입·출고 신속형 자동화 설비\n · 스마트팜 자동화 설비\n\n⑤ 패키징 자동화\n단순 포장을 넘어 다양한 기능의 스마트 설비로 Supply Chain 전반을 혁신하는 패키징 서비스\n · On-Demand 패키징 시스템\n · 컨테이너 자동 추천 시스템\n · RFID 검수 자동화 설비\n\n※ 고객 규모별 진입 순서: 소규모는 ③ 지능형 IoT(안전)나 ⑤ 패키징부터, 대형 프로젝트는 ④ 스마트팩토리·자동창고와 ② 디지털 트윈으로."],["E · 공정별 솔루션 포트폴리오","현장 공정 순서대로 어떤 설비를 넣을 수 있는지 지도. 고객 현장을 걸으면서 이 순서로 확인하면 빠진 공정이 없다.\n\n[하차/입고] 기준: 수작업·장비\n → 자동 상/하역 설비 · 디유니타이저(비전) · 무인장비 · 다종화물 디유니타이저(비전)\n\n[운반/적치] 기준: 수작업·장비\n → 컨베이어 · 무인이송로봇(AGV) · 자율주행로봇(AMR) · 무인장비\n\n[보관] 기준: 평치, 랙, 선반\n → 자동창고(AS/RS) · Carousel · 셔틀 시스템 · 무인이송로봇(AGV)\n\n[피킹/분류] 기준: 수작업\n → 웨어러블 슈트 · DPS/DAS · Auto Sorter · 자율주행로봇(AMR) · AGV(Sorting)\n\n[검수/포장] 기준: 수작업\n → 제함기 · 봉함기 · 오토라벨러 · On-demand Packaging\n\n[상차/출고] 기준: 수작업·장비\n → 자동 상/하역 설비 · 유니타이저(비전) · 무인장비 · 다종화물 유니타이저(비전)\n\n[공정 통합 기술]\nIntegrated Conveying / Storing / Sorting system · Picking / Gripping technology\n\n[소프트웨어 — 설비와 함께 붙는다]\n· MS1 — PRD-A (창고관리시스템)\n· MS3 — PRD-B (운송관리시스템)\n· 통합 관제·제어 — PRD-C\n· 운영장비 모니터링 — PRD-G\n· 안전 솔루션 — 장비 속도제어\n· 공유창고 플랫폼 — PRD-E\n· 비전 인식 기술 · RPA(Robotic Process Automation)\n\n※ 포트폴리오에는 상용화·확대 기술과 잠재·개발 기술이 섞여 있다. 고객에게 약속하기 전에 해당 설비의 상용화 단계를 반드시 본부에 확인할 것."],["E · 자동화 단계 매트릭스","같은 공정도 자동화 수준이 5단계로 나뉜다. 고객이 지금 어느 단계인지 짚어주고 다음 한 칸을 제안하는 것이 팔기 쉽다.\n\n[Level of Automation]\n수동 → 자동화 → 디지털화 → 최적화 → 지능화\n\n[수동 단계의 현장 모습]\n· 입고/출고 — 박스 또는 UNT를 하차·출하하고 장비로 이동\n· 적재/보관 — 평치·랙·선반에 수작업 적재\n· 반출~분류 — 작업자가 적재 공간을 이동하며 주문 상품을 반출·피킹·이송·분류\n· 포장 — 상품과 충전재를 포장 용기에 수작업으로 담음\n\n[자동화]\n이송·분류 구간에 Conveyor 시스템 도입\n\n[디지털화 — 실제 제안이 가장 많이 나오는 구간]\n· 입고/출고 — 무인장비(AGF), (디)유니타이저, 자동 상·하차\n· 적재/보관 — 자동 보관·반출(ASRS)\n· 피킹 — DAS / DPS\n· 이송 — AGV / AMR 시스템\n· 분류 — Sorting 시스템(Auto Sorter)\n· 포장 — 오토라벨러, 제함기, 봉함기, 온디맨드 패킹\n\n[최적화]\n피스 피킹 등 단품 단위 처리로 확장\n\n[지능화]\nAI 기반 입출고 · 데이터 분석 기반 보관/분류 · 피킹·그리핑 · 자율주행 · 맞춤형 포장\n로봇의 설계·제작·운영·제어 등 로봇 관련 전 기술 영역\n\n[설비를 5개 묶음으로 외운다]\n1 입고·출고 자동화 — 무인장비(AGF), 디유니타이저/유니타이저, 자동 상하차 설비\n2 보관 자동화 — 자동창고(ASRS): ①스태커크레인 ②셔틀 시스템 ③미니로더\n3 피킹 자동화 — DAS, DPS, 피스 피킹 로봇\n4 이송·분류 자동화 — AGV(Mini, 3D Sorter), AMR, Auto Sorter, Conveyor\n5 포장 자동화 — 제함기/봉함기, 오토라벨러, 온디맨드 패킹\n\n[약어]\nAGF Automated Guided Equip · ASRS Automated Storage and Retrieval System · AGV Automated Guided Vehicle · AMR Autonomous Mobile Robots"],["E · 설비사 자동창고 설비","표준화된 자체 설비 라인업. 숫자(물동량·보관량)가 있어 고객 앞에서 바로 비교가 되는 카드다.\n\n■ MDPS (Multi Deep Pallet Storage) — Shuttle type\n유니트에 적재된 화물을 장비 통로 등 불필요한 공간을 최소화해 공간 효율을 극대화한 신개념 셔틀랙 자동창고 시스템\n· 제한된 공간에 적재 효율 최대 — 유니트랙 대비 약 2배\n· 자동 입·출고를 통한 정확한 재고 관리\n· 입고·출고·보관·창고 운영 자동화로 무인화 실현\n· 에너지 세이브, 다양한 레이아웃 구성 가능\n· 설비 물동량 35 Pallet/hr (Shuttle 1대 기준)\n· 구성 — Shuttle & Satellite / Storage Rack / Lifter & Carriage / Conveyor & Diverter\n\n■ MDPS — Stacker Crane type\n기존 자동창고 대비 동일 번지에 다수의 유니트를 보관해 보관효율을 극대화한 스테커 셔틀랙 자동창고 시스템\n· 자동창고(ASRS) 대비 보관량 60% 증가\n· 유니트랙 대비 보관량 100% 증가\n· 동일 면적 대비 보관량 증대로 건축투자비 절감\n· 냉동/냉장 창고 적용 시 에너지 비용 50% 절감\n· 스테커크레인 1대 + 셔틀 조합으로 입·출고 가능\n· 구성 — Stacker Crane Unit / Shuttle Unit / Shuttle Rack Unit / Conveyor Unit\n\n■ Mini Load Stacker Crane System\n다양한 규격의 Carton을 Mini Load Stacker Crane과 자동창고 운영시스템에 연계한 자동 입·출고 시스템\n· 다양한 Carton 사용 가능\n· 심플한 원 마스터 설계, 독자 개발 및 자체 생산\n· 알루미늄 프로파일 포크 및 알루미늄 프레임 캐리지\n· 자체 생산 경량랙 구조물로 가격 경쟁력 우수\n· 물동량 100 Cycle/hr (Single, 1대 기준)\n· 구성 — Mini Load Unit / Carriage / 입·출고 Roller C/V / Divider C/V\n\n■ Mini Shuttle & Picking System\n미니 셔틀에 GTP(Good to Person) 개념을 적용해 박스 이송·보관·피킹이 가능한 운영 자동화 시스템\n· 모듈 단위 구성으로 유연한 확장성\n· 선반 랙에 의한 고밀도 저장\n· 알루미늄 프로파일 프레임, 사이드포크로 경제적인 셔틀\n· Shuttle과 Lifter 수량 가감으로 요구 물동량 대응\n· 물동량 90 Cycle/hr (Shuttle 1대 기준)\n· 구성 — Mini Shuttle Unit / Lifter Carriage Unit / Conveyor Unit / Picking Station Unit\n\n[영업 포인트]\n· 냉동·냉장 고객에게는 MDPS 스테커크레인형 — 에너지 비용 50% 절감이 가장 강한 숫자다\n· 부지가 좁거나 증축이 막힌 고객에게는 보관량 60~100% 증가 = 건축투자비 절감으로 말한다\n· 박스·낱개 단위 이커머스는 Mini Load / Mini Shuttle GTP 조합\n· 물동량은 모두 표준 1대 기준이다. 실제 필요 대수는 피크 물동량 기준으로 설계해야 하므로 현장에서 대수·처리량을 확정하지 말 것"],["E · 무인장비(AGF) 솔루션","장비 관련 모든 정보를 기록·분석해 운영 효율을 높이는 통합 관리 시스템과 다양한 안전 솔루션을 함께 제공합니다.\n\n[운영 효율성 UP]\n· MS1를 통한 실시간 운영 운영 데이터\n· 프로세스 단위로 능동적 작업 수행\n\n[경제성 및 생산성 UP]\n· 다수의 무인장비 동시 운영 가능\n· 최단 이동경로 및 최적 작업시간 설정으로 효율성 제고\n· 중앙 관제 시스템(ACS)에 의한 작업 통제\n\n[정확성 UP]\n· 위치 오차 10mm, 각도 0.5도 이내 정확도\n· 운영 인프라와 연동된 데이터 기반 운영\n· 운영 정보 가시화\n\n[안전성 UP]\n· 각종 센서를 통한 운영 중 장애물 감지 및 정지\n· 실시간 안전 상황 모니터링 및 대처\n· 오더 에러 대처 기능\n\n[영업 포인트]\n· 운영장비(S5) 장비 임대 고객이 그대로 AGF 후보다 — 임대 계약 갱신 시점에 무인화 검토를 같이 올린다\n· 야간·주말 무인 운영, 상시 인력난, 안전사고 이력이 있으면 1순위\n· 위치 오차 10mm·각도 0.5도는 경쟁 비교에서 바로 쓰는 숫자다\n· 단, 바닥 평탄도와 통로 폭, 랙 정렬 상태가 실제 도입 가능 여부를 가른다 — 반드시 현장 실사 후 판단"],["E · 파트너사 — 무인장비(AGF)","무인장비는 파트너사 4곳의 라인업을 고객 조건에 맞춰 고른다. 고객 업종과 요구 수준을 들으면 어느 파트너로 갈지 먼저 판단할 것.\n\n■ 비전나비 로보틱스 (VisionNav)\n· 중국 생산, 국내 지사 보유 / EPT · 리치 · C/B Type 등 다양한 라인업\n· 3D Lidar SLAM 네비게이션 기반 운영, 유니트·화물 인식으로 틀어진 적재를 얼라인 가능\n· 중국 내 다수 레퍼런스, 국내 대형 유통사 POC 레퍼런스 보유\n· 비전 인식 고도화로 Truck 상·하차 가능, 간단한 Customizing 개발 가능\n→ 유통/일반운영 중 기술력이 필요한 고객군, 복잡·고기술 요구 고객군(석유화학)\n\n■ 하이크로봇 (HIKROBOT)\n· 중국 생산, 국내 지사 보유 / EPT 위주 라인업\n· L2D + 3D 레이더 네비게이션 위치 인식, 전 제품 자체 제작·자체 수리 가능\n· 국내 생산/제조 라인 레퍼런스, 이차전지 운영 레퍼런스 일부\n· LGV/AGV 기반 위치 인식, 염가형·맞춤형 솔루션, Customizing 기반 모델 보유\n→ 생산/제조운영 중 이형물 취급 고객, 반도체·2차전지 고객군 집중\n\n■ 러셀 로보틱스 (Russell Robotics)\n· 국내 직접 생산 및 납품 / 리치(클라크), 삼방향(융하인리히) Type 보유\n· Laser 유도방식 위치 인식 — 현장에 맞는 경로 유도방식 기술 보유\n· 국내 생산/제조 운영 라인 다수 레퍼런스, 일반 운영 레퍼런스 일부\n· 삼방향장비 무인화 기술 보유, LGV 형식 주행 기술 개발 中\n→ 기존 VNA 활용 고객, 실내 생산/제조운영, Customizing 요구가 높은 고객군\n\n■ 시네바 (SINEVA)\n· 중국 생산 및 납품(Linde 등 협업 중) / EPT 위주 라인업\n· Laser SLAM 위치 인식 — 엘리베이터 Door 연계로 층간 이동 동선 가능\n· 중국 내 다수 레퍼런스, 국내 사업 검토 중\n→ 반도체·디스플레이 고객군 집중, 운영센터 Customizing 필요 고객군\n\n[장비 타입 용어 — 고객 앞에서 헷갈리면 안 된다]\n· EPT (Electro Pallet Truck) — 전동 유니트 트럭 타입\n· 리치 (Reach Type) — 전방으로 나온 아웃트리거로 차체 안정을 유지하고 Mast·Fork가 앞뒤로 이동\n· C/B (Counter Balance) — Mast·Fork를 전방에 장착하고 후방 카운터밸런스로 균형을 잡는 일반적 형태\n· VNA (Very Narrow Aisle) — 매우 좁은 통로에서 사용 가능한 장비\n\n※ 층간 이동이 필요하면 시네바, 기존 VNA가 있으면 러셀, 트럭 상하차까지 보면 비전나비 — 이 세 갈래만 기억하면 1차 분류는 된다."],["E · 파트너사 — (디)유니타이저 / AGV·AMR","■ (디)유니타이저 — 3D Vision과 AI 기반으로 화물의 모양·높이를 고려해 정형/비정형(혼합) 제품을 자동으로 이·적재\n\n· 엑스와이지로보틱스 (XYZ Robotics)\n 박스·Tote·드럼통 디유니타이저, 혼합 제품 유니타이저\n 랜덤 화물 비전 인식 SW 기술, 이동식 솔루션으로 공간 활용성 증대\n → 유통/일반운영 중 기술력 필요 고객군 (다양한 Box를 취급할 때 유용)\n\n· 토모 (TOMO)\n 염가형 협동로봇 (디)유니타이저, 일반 협동로봇\n 중국산 염가형 협동로봇 솔루션, 이동식·산업용 보유\n → 유통/일반운영 중 중·소형 고객\n\n· 씨메스 (CMES)\n Random Box 디유니타이저, Random SKU 유니타이저, 이종 혼합 유니타이저\n 다양한 Random 대응 로봇 라인업, 3D 비전·SW 기술 내재화가 강점\n → 유통/일반운영 중 Customizing 필요 고객군\n\n· 에스티씨엔지니어링 (STC Engineering)\n Gentry / 다관절 / 협동로봇 디유니타이저, 다관절 유니타이저\n 전자·자동화 등 제조운영 기술과 실적 다수, AGV/AMR 연계 구축 역량\n → 제조 Customizing / AMR SI 필요 고객군\n\n※ 고객 요구사항과 환경 조건에 맞게 혼합·비정형 패턴 대응 및 모바일 로봇 연계까지 구성 가능하다.\n\n■ AGV / AMR — 물동량 증감 대응 피킹·보관·분류·이송. QR·자석 Tag 등을 인식하는 AGV와 실시간 최적 경로를 생성하는 AMR\n\n· 하이크로봇 (HIKROBOT) — LMR(Latent Mobile Robot), CTU(Carton Transfer Unit)\n L-SLAM 자율주행, 이송·Tote 보관 솔루션 → 유통/일반운영\n· 긱플러스 (Geek+) — GTP 이송/운반 로봇, Robot Shuttle(Tote 보관), Fleet Sort(자동 분류)\n 다양한 솔루션을 연계한 창고 시스템 구현 → 유통/일반운영\n· 리비아오 로보틱스 (LIBIAO) — 자동 분류 모바일 로봇(소형·표준형·대형), Flat/Inclined/High/Conveyor/Plate 디바이스\n 다양한 분류 디바이스, 모듈화 설계로 유연한 배치 → 유통/일반운영 자동 분류 고객군\n· 유진로봇 — 자율주행 이송/운반 로봇(GoCart)\n 3D SLAM 자율주행, 다중 로봇제어 시스템(FMS) 연동 → 일반운영, 제조·DPS 고객군\n· 시네바 (SINEVA) — 이송/운반 S 시리즈, 이송 모바일 + 피킹 로봇 Sibot 시리즈\n L-SLAM 자율주행, 다중 로봇 제어 및 시뮬레이션 → 일반운영, 반도체·디스플레이\n\n※ 분류가 핵심이면 리비아오, GTP 창고형이면 긱플러스, 국산·FMS 연동이면 유진로봇 — 이 기준으로 먼저 좁힌다."],["E · 일괄 상·하차 솔루션 (ATLS)","제품 입고/출고 대응을 위해 컨테이너·차량에 자동으로 유니트를 투입/출하하는 일괄 상·하차 솔루션입니다.\n\n■ ACTIW 자동 상차 솔루션\nATLS(Automated Truck Loading System)는 트럭·트레일러 또는 컨테이너에 자동 적재 작업을 수행하는 자동화 설비입니다. 적재 자동화로 생산성을 개선합니다(석유화학, 제지 등).\n· 기능 구성 — 유니트 투입구 → 디버터 컨베이어(방향 전환) → 버퍼 컨베이어 → LoadMatic → 제어 판넬 / NG 배출 컨베이어\n\n· LoadMatic\n 유니트 제품을 투입해 일괄 상차, 에러 발생 시 NG 컨베이어로 배출\n 7분당 30톤 화물을 40피트 컨테이너에 적재\n 전기 장비 대비 최대 60% 전기 절감\n· LoadPlate\n 강철·목재 같은 비정형 제품 투입, 센터 외 야드에서 투입 진행\n 5분당 30톤 화물을 40피트 컨테이너에 적재\n 기존 적재량 대비 33% 용량 증가\n· LoadForming\n 자동창고 연계 유니트 제품 투입 (스태커크레인·RGV 등 연계)\n 도크당 200% 생산량 증가, 시퀀싱 및 로딩 작업 통합\n\n■ 엑스와이지로보틱스 자동 상차 솔루션 — RockyOne (Rocky Series MMR)\n3D 비전과 로봇 솔루션으로 컨테이너에 제품을 상차·하차하는 자동화 설비입니다(운영센터, 식품, 음료 등).\n· 구성 — Protect(이동·접이식 펜스, Active Safety) / Un·load(Rocky One) / Align(Box align) / Transport(Flexible Conveyor) / De·Palletize(Rocky Light SE)\n· 주요 대상 — 위탁운영, 식·음료, 가전 외\n· 취급 Unit — Carton Box\n· 제품 규격 — Min 150×150×150mm / Max 800×800×800mm\n· Load Weight — 25kg 이하\n· 시간당 처리량 — 400 Box/대\n· SLAM 방식 무인 이송(자율주행), Flexible C/V 연계로 공간 활용 극대화, 지능형 Gripper(개별 CUP 제어)\n· Vision 인식 — 제품 X·Y 적재 좌표 인식, 사전 모델 등록 없이 정확한 자동 상·하차\n· AI 모션 플래닝 — 빠른 궤적으로 정확한 이재, 제품 인식 0.5초 이내(99% 신뢰성), 작업 실패 시 Log 분석 기반 보정\n\n[영업 포인트]\n· 컨테이너 상하차는 여름·겨울 최악의 작업 구간이다. 인력 이탈이 심한 고객에게 먼저 꺼낸다\n· 유니트 단위 대량 출하(석유화학·제지)는 ACTIW, 박스 단위 혼적(위탁운영·식음료)은 RockyOne\n· \"7분/30톤\", \"400 Box/hr\" 같은 숫자는 고객의 현재 소요 시간과 바로 비교시켜 설득한다\n· 단, 도크 구조와 컨테이너 규격 대응 여부가 관건이다 — 반드시 현장 실사 후 확정"],["E · 핵심 역량 & 설계 Tool","[보유 핵심 역량 3가지]\n\n① 자동화 설비 기술개발\n운영·스마트팩토리 자동화 설비 도입에 대한 전문성과 최신 자동화 기술에 대한 연구·개발(국책 과제)\n · 미니로더 — 300m/min 고속 Stacker Crane\n · Shuttle — 운영작업 효율 개선 경량화물 취급 장비\n · High Stacker — 50m High Stacker Crane\n · FDS — 타이어 운반용 FDS\n · 식물재배 — 식물 재배 자동화 시스템\n · 원료 자동주입 — 톤백 원료 자동주입 시스템\n · 멀티 제함기 — 다관절 로봇 이용 멀티 제함기\n→ 고객니즈·최신 기술 Trend와 연계된 자동화 솔루션 확보, 기술·역량 내재화를 통한 자체 개발(설계/제작)\n\n② 자동화 설비 설계\n자동화 센터 Lay-out 및 보관·분류 등 운영/제조 운영 관련 전 영역에 대한 분석과 설계\n 주요 설계 항목 — ①Shuttle System ②AS/RS(Stacker crane) ③DPS / GTP+DAS ④Sequence buffer conveyor ⑤Wheel Sorter ⑥Robot Palletizer\n→ 데이터 분석 기반의 제품 카테고리·운영 기능별 센터 설계, 운영 환경 분석을 통한 맞춤형 세부 프로세스 제안\n\n③ 자동화 시스템 제작 / 구축 / AS\n고객사 현장 맞춤형 자동화 설비 상세설계와 최적 운영안 구축을 통한 생산성 개선 및 유지보수\n 대표 구성 — 오토스토어·AGV 소터 기반 F/C센터, Stacker Crane 기반 입·출고 자동화 센터\n→ 엔지니어링 컨설팅 기반 운영·제조 자동화 시스템 구축, AGV·AS/RS 등 첨단 기술 기반 로봇·설비 솔루션 적용\n\n[설계 & 시뮬레이션 Tool — 3단계]\n① 기본(개념) 설계 — 전체 윤곽·규모 결정, 레이아웃 기본 디자인, 운영 동선 및 설비 배치\n · Tool: 2D CAD(Autodesk), SketchUp\n · 산출물: 신규 센터 보관 레이아웃, 자동창고 시스템 설비 레이아웃\n② 제작(상세) 설계 — 제품·부품 구조 설계, 적용 사양 검토, 제작도·승인도 작성\n · Tool: 3D CAD Inventor(Autodesk), SolidWorks, CATIA\n · 산출물: 부품·기구·제품 설계, 제관도/단품도/조립도\n③ 3D 시뮬레이션(모델링) — 사전 운영 시뮬레이션, 물량 변동에 따른 영향도 분석, 타겟 생산성 및 자원 도출\n · Tool: FlexSim\n · 산출물: 실공정과 동일한 환경의 시뮬레이션, 사전 문제점 파악 및 개선사항 도출\n\n※ 설비를 사오는 회사가 아니라 설계·제작까지 내재화한 회사라는 점이 핵심이다. 국책 과제 기반 기술개발과 자체 생산 라인업(미니로더·셔틀·High Stacker)을 근거로 말할 것."],["E · 구축 실적","최근 5개년 60건 이상의 자동화 구축 실적을 보유하고 있습니다.\n\n[영역] 스마트팩토리(공정·보관 자동화) / 신재생에너지(2차전지 소재 자동창고) / 스마트 로지스틱스(창고 자동화·로봇)\n\n[설비] 자동창고·스태커크레인·컨베이어·RGV·갠트리·로봇 피킹·무인반송\n\n※ 고객사명·개별 프로젝트 내역은 대외 비공개다. 제안서에 인용할 실적표는 본부에서 별도로 받을 것."],["S · 시스템즈사","MS1, MS3 등 체계적인 운영 관리를 위한 운영정보시스템과 유관 플랫폼을 개발·운영하는 운영IT 전문기업입니다.\n\n[운영 IT Service]\nDX 기반 운영정보시스템 구축으로 운영 효율성을 높이고, 설비·장비 통합 제어와 플랫폼 기반 유휴 운영 자원 공유까지 지능형 IT 솔루션을 제공합니다.\n· DX 솔루션 개발 — 다양한 운영 환경의 인사이트 기반 IT 시스템·솔루션 개발 및 고객사 S2 혁신\n· AI/빅데이터 기반 선행 예측 — AI, 빅데이터, IoT로 선행 예측과 장애 극복이 가능한 운영 실현\n· 모니터링 체계 강화 — 네트워크 전담 인력 운영으로 요구사항·장애에 신속 대응\n\n[제품 브랜드 — 이름으로 말하면 신뢰가 다르다]\n· MS1: PRD-A — 창고 관리(검수·입고·적치·재고할당·피킹·출고)\n· MS3: PRD-B — 운송 관리(계획수립·배차·차량추적·라우팅·정산)\n· MS2: PRD-C — 운영정보 통합관제시스템\n· 모빌리티 플랫폼: PRD-F / PRD-G — 운영 장비 이슈 선제 대응 및 관제\n· 공유운영 플랫폼: PRD-E — AI 기반 창고 공실 검색·3D 렌더링 / PRD-H — 물품 보관 및 창고 스페이스 공유\n\n[서비스 영역]\n운영정보시스템(MS3·MS1로 제품과 정보의 흐름 통합관리) · 통합관제시스템(Web 기반 실시간 운영정보로 가시성 확보) · 모빌리티플랫폼(현장 사고 예방과 관리 효율화) · 공유운영플랫폼(유휴 자원 매칭·정산 원스톱)\n\n[주요 고객사]\n· 고객사명은 대외 비공개다. 본부 레퍼런스 자료를 확인할 것."],["S · 5대 솔루션","① PRD-A — 창고정보 통합 시스템\n스마트 운영플랫폼 기반의 OMS·MS1 기능을 제공합니다. 다양한 산업분야 적용 사례를 기반으로 고객 맞춤형 서비스를 제공합니다.\n · 대시보드 / 실시간 자산 관리 / 모바일 APP(PRD-A MOBILE)\n\n② PRD-B — 운송 운영 시스템\n최적의 운송 계획을 수립하고 실행 과정을 모니터링하며 운송 관련 활동을 효율적으로 지원합니다.\n · 실시간 위치·운송 이력 차량 관제 / 운송·온도 등 종합 운송정보 관리 / MAP 기반 최단·최적 경로 관리\n\n③ PRD-C — 창고 제어 시스템\n모든 디바이스를 IoT로 연결하고 수집 데이터를 기반으로 실시간 안전·운영 데이터를 제공합니다.\n · 자동화 설비 실시간 모니터링 / 실시간 설비 최적화 / 설비연동시스템(ESC)\n\n④ PRD-D — Smart Cold Chain System\n콜드체인 대상 스마트 운영 시스템.\n ※ 원자료의 설명 문구가 스마트팩토리 항목과 동일하게 기재되어 있어, 정확한 기능 범위는 본부 확인 후 사용할 것.\n\n⑤ PRD-E — 온디맨드 창고 매칭 플랫폼\n창고주와 화주를 연결하는 온디맨드 프롭테크 플랫폼으로, 빠르고 간편하게 필요한 창고를 제공합니다.\n · On-Demand 플랫폼 / 3D 창고투어 서비스 / 비대면 전자 계약\n\n※ MS1·MS3는 설비 없이도 단독으로 팔 수 있는 상품이다. 자동화 예산이 없는 고객에게 먼저 들어가는 문으로 쓸 것."],["S · 시스템 포트폴리오","영역별 보유 시스템 지도. 고객 업무를 들으면 어느 시스템이 붙는지 바로 찾을 수 있다.\n\n[Pallet & Container Pool System]\n· 스마트랜스\n· NPPS / UCPS (Pallet & Container) — 수불 관리, 정산·청구 관리, 거래처 관리\n· Link(RFID) — Pallet 자산관리\n· ULTRAVIS(Global) — 상품이력 추적관리\n· [해외] GLMS (Global Logistics System) — 다국어 지원, Pallet·Container 수불 관리, 정산·청구, 거래처 관리(실수요처·계약처)\n\n[RFID & Equipment]\n· PRD-F — 정비 Data, 정비 이력, 소모품, 장비 정보\n· PRD-G — 가동 시간, 생산성 관리, 안전 정보, Driver 관리\n\n[Contract Logistics (W&D)]\n· POMS (Productivity Operation Management System) — 사업장 생산성\n· OMS(주문) → PRD-A MS1(보관) → PRD-B MS3(운송), Visibility, MS2(설비), Smart PRD-B\n· IoT·Cloud·BigData·Mobile 기반 — 고객사 I/F, 주문 관리, MST 관리, 입·출고, Strategy, 재고 관리, 배차 관리, 위치 정보, 상·하차, 정산 관리\n\n[공유 Platform]\n· PRD-E(공유창고) / 운송주선 / 유휴자원\n\n[Common]\n· NAMS / 그룹웨어(Intranet) / CRM / [해외] Global ERP\n\n[Tech & Engineering]\n· 설비 — DPS·DAS, QPS(Quick Picking System), 제함기·봉함기, 유니타이저, QR AGV(Sorting), 오토라벨러, 자동 상하차 설비, 무인장비\n· 시스템 — MS1(PRD-A), 통합 관제·제어(PRD-C), MS3(PRD-B), 운영장비 모니터링(PRD-G)\n\n[약어]\nPRD-A 창고정보 통합 시스템 · PRD-B 운송 운영 시스템 · POMS Productivity Operation Management System"],["S · 구축 실적","[제품별 구축 실적]\n· PRD-A(창고관리) — 프랜차이즈·유통·리테일 센터 다수 (2021~2022)\n· PRD-B(운송관리) — 국내 통합 운송 시스템 및 해외 법인 구축 (2014~2022)\n\n[영역별 운영 실적]\n· E-COMM — 온라인 주문접수·보관·택배배송, 거점 재고관리, 크로스보딩\n· 자동차부품 — CKD 포장·해상항공 운송·해외 거점 이재 후 납품, AS부품 관리\n· 식음료 / 화학 — 가맹점·유통점 보관배송, 원부자재 보관, 화주 ERP 연동\n· B2C·설치 — 임가공·택배 연동, 설치 배송 및 CS·리퍼 관리\n\n※ 고객사명·센터명은 대외 비공개다. 사내 사례는 본부 자료를 확인해 인용할 것."],["솔루션 카탈로그 (C · E · S)","[C · 컨설팅 — 운영 인프라 최적화 설계]\n· 신축 운영센터 최적화 설계 — 공간 활용·작업 흐름·자동화 설비를 포함한 전체 운영 효율 설계\n· 컨설팅 기반 자동화 설비 제안·설계 — 운영환경·공정효율·요구사항 간이진단으로 맞춤 설비 추천\n· 자동화 설비 기반 패키징 설계 — 포장 공정 자동화 설비·시스템 설계로 효율과 정확도 향상\n\n[E · 운영 자동화 솔루션]\n▸ 입/출고\n · (디)유니타이져 — 유니트 화물 자동 적재/분리\n · 다종화물 (디)유니타이져 — 여러 종류 화물 동시 취급\n▸ 보관 (AS/RS)\n · 스태커크레인 — 자동 저장·회수 크레인\n · Autostore — 소형 로봇 기반 고밀도 보관\n · 셔틀 — 셔틀로 저장품 고속 이동\n▸ 검수/포장\n · 제함기 — 포장용 상자 자동 제작\n · 봉함기 — 포장 후 박스 자동 밀봉\n · 오토라벨러 — 상품·박스 라벨 자동 부착\n · Pack Master — 다양한 크기·형태 대응 고급 자동 포장\n · Carton Box 자동포장 솔루션 — 조립·투입·밀봉 일괄\n▸ 운반/적치\n · AGV — 정해진 경로 무인 운반차\n · AMR — 환경 인식·최적 경로 자율주행 로봇\n · AGF(무인장비) — AGV에 장비 기능 결합, 복잡한 적재·하역 수행\n▸ 피킹/분류\n · DPS — 주문 정보 디지털화로 피킹 정확도·속도 향상\n · DAS — 작업 전표 없이 디지털 표시기로 분배\n · AMR — 클로이 피킹로봇 등\n · QR AGV(3D Sorter) — QR 식별 + 자동 분류·정렬\n\n[S · 운영 IT 솔루션]\n▸ 운영센터 운영관리\n · MS1 — 재고 추적·주문 처리·피킹·입출고 관리\n · TAMS — 작업자 근태(출퇴근·근무·초과근무) 관리\n · POMS — 생산 주문부터 생산·배송까지 전 과정 관리\n · 키오스크 — 주문 입력·정보 조회 등 현장 무인 단말\n▸ 운영 설비 제어관리\n · MS2 — 자동화 장비 실시간 모니터링·제어, MS1와 통합해 작업 흐름 최적화\n▸ 운영 운송관리\n · MS3 — 경로 계획·화물 추적·운송사 선정·운임 계산·성과 분석"],["핵심 영업 스킬 — 자동화솔루션(S4)","[고객 한마디 → 추천 솔루션]\n· \"사람을 못 구한다 / 야간 인력이 없다\" → AGV · AMR · AGF, DPS/DAS\n· \"유니트 적재가 힘들다, 허리 부상 난다\" → (디)유니타이져\n· \"창고가 좁다, 더 못 쌓는다\" → AS/RS(Autostore · 셔틀 · 스태커크레인)\n· \"포장 라인이 병목이다\" → 제함기 · 봉함기 · 오토라벨러 · Pack Master · Carton Box 자동포장\n· \"오출고·오분류가 잦다\" → DPS/DAS · QR AGV(3D Sorter) · MS1\n· \"전산 재고와 실물이 안 맞는다\" → MS1 · 키오스크(수불 무인화)\n· \"설비는 있는데 서로 안 물린다\" → MS2\n· \"배차·운임이 주먹구구다\" → MS3\n· \"근태·작업시간을 수기로 쓴다\" → TAMS\n· \"생산 오더가 흩어져 있다\" → POMS\n· \"운영센터를 새로 짓는다/이전한다\" → C 컨설팅부터 (가장 큰 기회)\n· \"배송 거점을 어디에 둘지 모르겠다\" → N/W 최적화 로직 · Log-hub 시뮬레이션(컨설팅)\n· \"근골격계 질환·중대재해가 걱정이다\" → Wearable Suit · 장비 속도제어 솔루션\n· \"장비가 어디서 뭘 하는지 모른다\" → PRD-F / PRD-G 모빌리티 관제\n· \"창고 공간이 남는다 / 모자란다\" → PRD-E · PRD-H(공유운영 플랫폼)\n· \"포장을 바꾸고 싶다(콜드체인 등)\" → 스마트 패키징 컨설팅\n\n[상담 4단계]\n1. 병목 공정 하나를 특정한다 — 적치? 보관? 포장? 피킹? 분류?\n2. 간이진단으로 넘긴다 — 운영환경·공정효율·요구사항 확인 const $=s=>document.querySelector(s);

let toastT=null;
function toast(m){const t=$('#toast'); t.textContent=m; t.style.display='block';
 clearTimeout(toastT); toastT=setTimeout(()=>t.style.display='none',1800)}
function copyText(s){
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(()=>toast('복사되었습니다'),()=>fallbackCopy(s))}
 else fallbackCopy(s)}
function fallbackCopy(s){const ta=document.createElement('textarea'); ta.value=s; document.body.appendChild(ta);
 ta.select(); try{document.execCommand('copy'); toast('복사되었습니다')}catch(e){toast('복사 실패 — 길게 눌러 복사하세요')} ta.remove()}

function closeSheet(){$('#sheet').classList.remove('on'); $('#sheetbg').classList.remove('on')}

const view=$('#view');
function nav(h){location.hash=h}
window.addEventListener('hashchange',render);

const TABS=[
 {k:'biz', n:'사업', ic:I.kase, h:'#/'},
 {k:'corp', n:'업체', ic:I.pin, h:'#/corp'},
 {k:'know', n:'지식', ic:I.book, h:'#/know'}
];
function drawTabs(cur){
 $('#tabbar').innerHTML=TABS.map(t=>`<button class="${t.k===cur?'on':''}" onclick="nav('${t.h.slice(1)}')">${t.ic}${t.n}</button>`).join('');
}

function render(){
 closeSheet();
 const h=(location.hash||'#/').slice(1);
 const p=h.split('/').filter(Boolean);
 window.scrollTo(0,0);
 if(p[0]==='corp'){drawTabs('corp'); return vCorp()}
 if(p[0]==='know'){drawTabs('know'); return vKnow()}
 drawTabs('biz');
 if(p[0]==='biz'&&p[1]){
   const b=bizOf(p[1]); if(!b) return vHome();
   if(p[2]==='skill') return vSkill(b);
   if(p[2]==='check') return vCheck(b);
   if(p[2]==='quote') return vQuote(b);
   return vBiz(b);
 }
 vHome();
}

function hdr(o){
 return `<header class="hdr">
  ${o.back?`<button class="back" onclick="nav('${o.back}')">${I.bchev} ${o.backTxt||'뒤로'}</button>`:''}
  <div class="brand">${o.brand||'영업마스터'}</div>
  <h1>${o.t}</h1>
  ${o.s?`<div class="sub">${o.s}</div>`:''}
 </header>`;
}

/* CHECK 콘텐츠는 두 형태를 지원:
   - 문자열 배열: 항목 그대로 체크박스
   - 원문 문자열: [헤더] 줄은 소제목, 번호/·/- 줄은 체크 항목, 나머지는 설명으로 렌더 */
function checkModel(k){
 const c=CHECK[k]; if(!c) return [];
 if(Array.isArray(c)) return c.map(t=>({t, chk:true}));
 const rows=[];
 c.split('\n').forEach(line=>{
  const s=line.trim(); if(!s) return;
  if(/^\[.+\]$/.test(s)) rows.push({t:s.slice(1,-1), h:true});
  else if(/^(\d+[.)]\s?|[·\-▷•→※]\s?)/.test(s)) rows.push({t:s.replace(/^(\d+[.)]\s?|[·\-▷•]\s?)/,''), chk:!/^[→※]/.test(s)});
  else rows.push({t:s});
 });
 return rows;
}
function vCheck(b){
 const rows=checkModel(b.k);
 const st=store.get('chk.'+b.k,{});
 let ci=-1;
 view.innerHTML=hdr({back:'/biz/'+b.k, backTxt:b.n, brand:b.tag, t:'체크리스트', s:'견적 전 필수 확인 — 확인한 항목을 체크하세요'})+
 `<div class="body fadein">
   ${rows.length?`<div class="card">
     <div class="chkbar"><div class="prog"><i id="chkprog"></i></div><b id="chkcnt"></b></div>
     ${rows.map(r=>{
       if(r.h) return `<div style="padding:12px 14px 4px; font-size:12px; font-weight:800; color:var(--navy)">${esc(r.t)}</div>`;
       if(!r.chk) return `<div class="hint" style="padding:2px 14px 6px">${esc(r.t)}</div>`;
       ci++;
       return `<label class="chk"><input type="checkbox" ${st[ci]?'checked':''}
        onchange="chkToggle('${b.k}',${ci},this.checked)"><span>${esc(r.t)}</span></label>`;
     }).join('')}
   </div>
   <div class="btnrow">
     <button class="btn pri" onclick="chkCopy('${b.k}')">${I.copy} 견적요청 양식 복사</button>
     <button class="btn ghost" onclick="chkReset('${b.k}')">체크 초기화</button>
   </div>
   <p class="hint">양식 복사: 체크 안 된 항목은 (미확인)으로 표시되어, 지점·본사 견적 요청 시 그대로 붙여넣을 수 있습니다.</p>`
   :`<div class="card" style="padding:16px; color:var(--sub); font-size:13.5px">콘텐츠 준비 중입니다.</div>`}
 </div>`;
 chkProg(b.k);
}
function chkItems(k){return checkModel(k).filter(r=>r.chk)}
function chkToggle(k,i,v){const st=store.get('chk.'+k,{}); st[i]=v; store.set('chk.'+k,st); chkProg(k)}
function chkProg(k){
 const items=chkItems(k), st=store.get('chk.'+k,{});
 const done=items.filter((_,i)=>st[i]).length;
 if($('#chkprog')) $('#chkprog').style.width=(items.length?done/items.length*100:0)+'%';
 if($('#chkcnt')) $('#chkcnt').textContent=done+'/'+items.length;
}
function chkReset(k){store.set('chk.'+k,{}); render()}
function chkCopy(k){
 const b=bizOf(k), st=store.get('chk.'+k,{});
 let ci=-1;
 const lines=checkModel(k).filter(r=>r.h||r.chk).map(r=>{
  if(r.h) return '\n['+r.t+']';
  ci++; return (st[ci]?'■ ':'□ ')+r.t+(st[ci]?'':'  (미확인)');
 });
 copyText(`[${b.n} 견적 확인사항]`+lines.join('\n'));
}

 {id:'c2', n:'대영식품 부산공장', memo:'식품 제조 · S1 신규 타겟', biz:'s1', lat:35.176, lng:128.962},

];
let myPos=store.get('pos',null);
function corpList(){return store.get('corps',CORP_SEED)}
function corpSave(list){store.set('corps',list)}
function distKm(a,b){
 if(!a||!b||b.lat==null) return null;
 const R=6371, dLat=(b.lat-a.lat)*Math.PI/180, dLng=(b.lng-a.lng)*Math.PI/180;
 const x=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;
 return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
let corpMode=store.get('corpMode','all');
const NAVER_KW=['제조공장','운영센터','식품공장','포장 제조','창고','유통센터'];

 const list=corpList().map(c=>({...c, d:distKm(myPos,c)}))

     <span class="dist">${c.d!=null?c.d.toFixed(1)+'km':'—'}</span>
     <div><b>${esc(c.n)}</b><small>${esc(c.memo||'')}</small></div>

   <div class="kwrow">
    ${NAVER_KW.map(k=>`<a class="kw" target="_blank" rel="noopener"
      href="https://map.naver.com/p/search/${encodeURIComponent((myPos&&myPos.label?myPos.label+' ':'')+k)}">${k} ${I.ext}</a>`).join('')}
   </div>
   <p class="hint">키워드를 누르면 네이버 지도에서 내 주변 해당 업종이 검색됩니다. 발굴한 업체는 ‘업체 등록’으로 내부데이터에 추가하세요.</p>`:''}
 </div>`;
}

}

 {cat:'영업 기본', t:'견적 제시의 원칙', b:'단가만 먼저 말하지 않는다. 조건(수량·기간·회수·운송)을 확인한 뒤 총비용으로 제안하고, 단가 이야기는 비교 기준(TCO)을 세운 다음에.'},
 {cat:'교육자료', t:'유니트 규격과 공유시스템 기초', b:'SZ-A(1100×1100)·SZ-B(1200×1000) 표준 규격, 회수율 개념, 공유시스템의 원리(공동이용·회수·수리·재투입 순환)를 이해하면 모든 사업 설명이 쉬워진다.'},
 {cat:'교육자료', t:'미회수 관리의 기본', b:'거래처에 쌓인 유니트는 곧 원가. 월 1회 이상 거래처별 미회수 수량을 확인하고, 회수 일정을 고객과 합의해 두는 것이 영업과 운영의 접점.'}
];
let knowCat='전체', knowQ='';
function knowList(){return store.get('know',KNOW_SEED)}
function vKnow(){
 const cats=['전체','회사소개','영업 기본','교육자료'];
 const list=knowList().filter(k=>(knowCat==='전체'||k.cat===knowCat)&&
   (!knowQ||(k.t+k.b).toLowerCase().includes(knowQ.toLowerCase())));
 view.innerHTML=hdr({t:'영업 지식', s:'내부 소개 · 교육자료'})+
 `<div class="body fadein">
   <div class="srch">${I.search}<input id="kq" placeholder="지식 검색 — 예: 회수율, 유니트 규격" value="${esc(knowQ)}"></div>
   <div class="chips">${cats.map(c=>`<button class="${knowCat===c?'on':''}" onclick="knowSetCat('${c}')">${c}</button>`).join('')}</div>
   ${list.map(k=>`<div class="card kn"><span class="tag">${esc(k.cat)}</span><b>${esc(k.t)}</b><div class="kb">${esc(k.b)}</div></div>`).join('')||
    `<div class="card" style="padding:16px;color:var(--sub);font-size:13.5px">검색 결과가 없습니다.</div>`}
   <button class="btn ghost" onclick="knowAddSheet()">${I.plus} 지식 추가</button>
 </div>`;
 $('#kq').addEventListener('input',e=>{knowQ=e.target.value; vKnow(); const el=$('#kq'); el.focus(); el.setSelectionRange(el.value.length,el.value.length)});
}
function knowSetCat(c){knowCat=c; vKnow()}
function knowAddSheet(){
 openSheet(`<h3>지식 추가</h3><div class="ssub">교육·소개 자료를 직접 등록합니다</div>
  <div style="display:flex;flex-direction:column;gap:10px">
   <div class="fi"><label>분류</label><select id="ka_c"><option>회사소개</option><option>영업 기본</option><option>교육자료</option></select></div>
   <div class="fi"><label>제목</label><input id="ka_t"></div>
   <div class="fi"><label>내용</label><textarea id="ka_b" rows="5"></textarea></div>
   <button class="btn pri" onclick="knowAdd()">등록</button>
  </div>`);
}
function knowAdd(){
 const t=$('#ka_t').value.trim(); if(!t) return toast('제목을 입력하세요');
 const l=knowList(); l.unshift({cat:$('#ka_c').value, t, b:$('#ka_b').value.trim()});
 store.set('know',l); closeSheet(); vKnow();
}

render();
</script>
</body>
</html>
