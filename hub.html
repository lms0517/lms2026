<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KPP 영업</title>
<meta name="theme-color" content="#123c7a">
<style>
 :root{--blue:#123c7a;--grad:linear-gradient(135deg,#0a2d5e 0%,#123c7a 55%,#17509b 100%);
   --bg:#eef0f4;--card:#fff;--line:#e3e8ef;--txt:#14213d;--sub:#6b7280;--gold:#e0a32e;
   --sh:0 1px 3px rgba(16,42,80,.09),0 1px 2px rgba(16,42,80,.04);}
 *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--txt);font-size:15px;line-height:1.55;
   font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;}
 .hd{background:var(--grad);color:#fff;padding:26px 18px 30px;padding-top:calc(26px + env(safe-area-inset-top));}
 .hd .ne{font-size:11.5px;font-weight:800;letter-spacing:.14em;color:var(--gold);}
 .hd h1{margin:7px 0 0;font-size:25px;font-weight:800;letter-spacing:-.5px;}
 .hd p{margin:7px 0 0;font-size:13px;opacity:.82;}
 .w{max-width:560px;margin:0 auto;padding:16px 14px 40px;}
 .sec{font-size:12px;font-weight:800;color:var(--sub);letter-spacing:.04em;margin:20px 2px 8px;}
 .sec:first-child{margin-top:4px;}
 a.card{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
   border-radius:14px;box-shadow:var(--sh);padding:15px 16px;margin-bottom:9px;text-decoration:none;color:inherit;}
 a.card:active{transform:scale(.985);}
 a.card.hi{background:var(--grad);border:none;color:#fff;}
 .ic{width:42px;height:42px;flex:none;border-radius:11px;background:#eaf0f8;display:flex;
   align-items:center;justify-content:center;font-size:21px;}
 a.card.hi .ic{background:rgba(255,255,255,.16);}
 .tx{flex:1;min-width:0} .tx b{display:block;font-size:15px;font-weight:800;letter-spacing:-.2px;}
 .tx span{display:block;font-size:12px;color:var(--sub);margin-top:2px;}
 a.card.hi .tx span{color:#c6d6f2;}
 .go{color:#9aa4b2;font-size:19px;flex:none;} a.card.hi .go{color:rgba(255,255,255,.7);}
 .ft{font-size:11.5px;color:var(--sub);text-align:center;margin-top:22px;line-height:1.7;}
</style>
</head>
<body>
<div class="hd">
  <div class="ne">KPP</div>
  <h1>영업 통합</h1>
  <p>대시보드 · 견적앱</p>
</div>
<div class="w">
  <div class="sec">영업 대시보드</div>
  <a class="card hi" href="대시보드.html">
    <div class="ic">💼</div>
    <div class="tx"><b>영업마스터</b><span>사업별 영업 스킬 · 견적 · 업체 지도</span></div>
    <span class="go">›</span></a>

  <div class="sec">견적앱</div>
  <a class="card" href="대시보드.html">
    <div class="ic">🟦</div>
    <div class="tx"><b>PPS 견적앱</b><span>구내용 · 수송용 · 운임 — 대시보드 안에 있습니다</span></div>
    <span class="go">›</span></a>
  <a class="card" href="apps/rrpp/">
    <div class="ic">♻️</div>
    <div class="tx"><b>RRPP 견적앱</b><span>규격·수량별 제안단가 · 제안서 PDF</span></div>
    <span class="go">›</span></a>
  <a class="card" href="apps/equip/equip.html">
    <div class="ic">🚜</div>
    <div class="tx"><b>장비 견적앱</b><span>현장 조건 기반 임대 견적</span></div>
    <span class="go">›</span></a>
  <a class="card" href="https://ipgomi-app.github.io/a2026/">
    <div class="ic">🚚</div>
    <div class="tx"><b>운송견적</b><span>차종·구간별 운송 단가</span></div>
    <span class="go">›</span></a>
  <a class="card" href="https://ipgomi-app.github.io/B2026/v2/">
    <div class="ic">🏗️</div>
    <div class="tx"><b>엔지니어링 제안</b><span>자동화창고 1차 개념제안</span></div>
    <span class="go">›</span></a>

  <div class="ft">앱 주소가 바뀌면 대시보드의 TOOLS 목록만 고치면 됩니다.</div>
</div>
</body>
</html>
